# How this repository is tested, checked, built and deployed, read against the schema in
# docs/declaration.md by every verb run in a checkout of it.

testbed = 0
name = "bmo-testbed"
# The base library whose major changes run this repository's suite.
upstreams = ["bmo-text"]

[test]
# The Cargo workspace's crates, and the test kit: a project of its own, whose check script bun runs,
# its type check and then its own tests.
languages = ["cargo", "bun"]
setup = ["cd testkit && bun install --frozen-lockfile"]

# The scratch database's tests make their own databases on the server, so no template is named.
[test.database]

[check]
quick = ["dashes", "language", "layout", "dependencies", "cargo-profile", "shared-versions"]
# The text a person reads: the verbs' words in the policy, and the literals of the crates, the hosted tools
# and the kit.
people_text = ["policy/*.toml", "*/src/**/*.rs", "tools/*/src/**/*.rs", "testkit/*.ts"]
language_ledger = "docs/language-ledger.json"
# The base libraries: the one whose verdicts the quick checks take, and bmo-chat's console face, whose
# reading of a console manifest through the layer's own release the console probe runs.
base_libraries = ["bmo-text", "bmo-console-face"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[build]
# The binary, and the hosted deploy tool's executable, which the step that places the tool copies.
binaries = ["bmo-testbed", "deploy-tool"]

[deploy]
root = "~/.local/share/bmo-testbed"
data_root = "~/.local/share/bmo-testbed/data"
# The prune of the shared Cargo build directory and its timer, kept by every deployment by their marks.
units = ["units/*.service", "units/*.timer"]

# The binary, linked into `.local/bin` under the home directory beside `bmo`, which serves the nouns this
# binary declares from there (docs/boundary.md, 「The binary」). The link names the deploy tree's own link,
# which stands across releases.
[[deploy.step]]
id = "link-command"
phase = "before-flip"
command = '''
set -eu
mkdir -p "$HOME/.local/bin"
ln -sfn "$HOME/.local/share/bmo-testbed/deploy/bin/bmo-testbed" "$HOME/.local/bin/bmo-testbed"
'''

# The hosted deploy tool is placed in its folder's .placed/, the folder the tool host reads (docs/deploy.md,
# 「The hosted deploy tool」): the executable the release's bin/ holds, its manifest and its input schema,
# put into the tool host's registry for this service with the capability its entry asks for allowed.
[[deploy.step]]
id = "place-deploy-tool"
phase = "before-flip"
command = '''
set -eu
rm -rf tools/deploy/.placed
mkdir -p tools/deploy/.placed
cp bin/deploy-tool tools/deploy/tool.toml tools/deploy/deploy.json tools/deploy/.placed/
bmo-pocket put tools/deploy/.placed --placed --service testbed --allow deploy
'''
