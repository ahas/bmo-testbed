[package]
name = "bmo-testbed-cli"
description = "The bmo-testbed binary: each verb's words read and handed to the crates."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
name = "bmo_testbed_cli"
path = "src/lib.rs"

[[bin]]
name = "bmo-testbed"
path = "src/main.rs"

[dependencies]
axum.workspace = true
bmo-testbed-backup = { path = "../backup" }
bmo-testbed-client = { path = "../client" }
bmo-testbed-core = { path = "../core" }
bmo-testbed-deploy = { path = "../deploy" }
bmo-testbed-install = { path = "../install" }
bmo-testbed-plugin = { path = "../plugin" }
bmo-testbed-record = { path = "../record" }
bmo-testbed-service = { path = "../service" }
bmo-testbed-suite = { path = "../suite" }
bmo-testbed-supervise = { path = "../supervise" }
bmo-text.workspace = true
brush-parser.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
sse-stream.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
url.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
