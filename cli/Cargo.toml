[package]
name = "bmo-testbed-cli"
description = "The bmo-testbed binary: each verb's words read and handed to the crates."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "bmo_testbed_cli"
path = "src/lib.rs"

[[bin]]
name = "bmo-testbed"
path = "src/main.rs"

[dependencies]
bmo-testbed-core = { path = "../core" }
bmo-testbed-suite = { path = "../suite" }
brush-parser.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
sse-stream.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
axum.workspace = true
libc.workspace = true
tempfile.workspace = true
