[package]
name = "bmo-testbed-cli"
description = "The bmo-testbed binary: each verb's words read and handed to the crates."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "bmo_testbed_cli"
path = "src/lib.rs"

[[bin]]
name = "bmo-testbed"
path = "src/main.rs"

[dependencies]
axum.workspace = true
bmo-testbed-client = { path = "../client" }
bmo-testbed-core = { path = "../core" }
bmo-testbed-deploy = { path = "../deploy" }
bmo-testbed-plugin = { path = "../plugin" }
bmo-testbed-record = { path = "../record" }
bmo-testbed-service = { path = "../service" }
bmo-testbed-suite = { path = "../suite" }
bmo-text.workspace = true
brush-parser.workspace = true
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
sse-stream.workspace = true
tokio.workspace = true
toml.workspace = true

[dev-dependencies]
libc.workspace = true
tempfile.workspace = true
