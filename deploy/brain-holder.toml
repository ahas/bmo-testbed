# This service's standing line in every agent's brain: when to reach for it. How its tools are called is
# their manuals', handed with a tool's first call in a session.
held_by = "testbed"

[[memory]]
key = "testbed.when"
type = "tip"
recall_condition = "a test suite, a build, or a commit to put live"
text = "Run tests through testbed_run or bmo check, and put a commit live only with the testbed deploy tool."
