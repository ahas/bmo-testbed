# The binary's own words (docs/boundary.md, 「The binary」 and 「The verbs」): the usage `--help` prints,
# for the binary and for each verb, and what each verb says of itself. A harness reads the words, so they are
# English. {verb} is the binary's name.

[usage]
binary = """
usage: {verb} <verb> [<words>…]

run       a heavy test or build command, run in the machine's turn
placed    the far side of a run placed on this machine: the setup, then the command
crate-tests  the suite's own: a crate's test binaries written down as Cargo runs them, or run
          from that record
status    each lane and the repository's close line: who holds it, and who waits behind
classify  whether a shell line holds a heavy command started outside the testbed
suite     the repository's units, every one or those a change reaches
dependents  the checkouts that build on this repository, listed or each one's suite run
passed    the passed run of the whole suite on a commit this machine's record holds, which a
          deployment's gate takes in place of its own suite
toolchain the toolchains the checkout is built and tested with, each language's own answer
count     the tests a range removed, each accounted for or not, and the tests the tree holds
log       what a suite's or a single run's log came to
template  the suite's template database made, dropped or swept
check     the check of a change, or one of the quick checks
imports   the relative imports a move left broken, and where they go
cargo     Cargo over the shared build directory, in the machine's turn where it compiles;
          `cargo prune` removes what no build reads
prune     what no build reads any more, removed from the shared Cargo build directory
full      the daily whole run of the repository's suite, in a unit of its own
deploy    a commit of the repository put live, in a unit of its own; `deploy commit` as
          the platform names it
backups   the backups a deployment took, sent away and rotated; `deploy backups` as the
          platform names it
backup    the machine's databases and data folders backed up to its destinations, and the
          restore drill: backup snapshot, backup media, backup drill and backup prune
serve     the HTTP service: the record and the lanes, read-only behind a token
mcp       the harness plugin's MCP server, on standard input and output
notice    an event a hook is handed, told to the owner's supervisor through the receiver
nouns     the nouns `bmo` dispatches to this binary, one a line
test      the platform's names for the suite verbs: test suite, test count, test log,
          test template and test full

{verb} <verb> --help prints that verb's own usage (docs/boundary.md)."""
run = """
usage: {verb} run [--narrow] [--adapter <name>] [--json] -- <command…>

Runs a heavy test or build command in the machine's turn: it waits behind every other such
command of its lane on this machine, however long that takes, then runs alone there until it ends,
handed the lane's width, and ends on one line: passed or not, how many tests passed, failed and were skipped, how long it ran and
waited, and the log holding its whole output, with what failed under it.

--narrow   the narrow lane, beside the wide lane's holder on a quarter of the machine, for a
           command that needs only a few threads: one file run again and again, a script of its
           own over one test
--adapter  the language that runs it, instead of the one that claims the command
--json     the lines on standard error, and on standard output one command run once it has ended
           (docs/boundary.md)

Where the harness it runs for goes away before the turn comes, nothing runs and it ends with exit
code 75."""
status = """
usage: {verb} status [--json]

Each lane: its width, who holds the turn and since when, and who waits behind it in order; then the
close line of the repository it is run in (docs/testbed.md).

--json  the same as one JSON object (docs/boundary.md)"""
classify = """
usage: {verb} classify [--json] [--takes-turn <command>]… <shell line>

Reads the shell line, given as one word, the way the shell splits it, and answers `light`, or
`heavy` with the language claiming the command and the line to run in its place. Exits 0 for a
light line and 1 for a heavy one.

--takes-turn  a command that takes the turn itself, its program and the words it opens with
--json        the answer as one JSON object (docs/boundary.md)"""
suite = """
usage: {verb} suite [--since <commit>] [--again] [--json] [<word>…]

Runs the repository's units in the machine's turn (docs/suite.md): every one, or those the change
since a commit reaches. A word naming a path narrows the files, a word naming a unit exactly picks
it, and every other word goes to each file's runner. Every unit runs until it ends. The verb's own
flags come before its words.

--since       the commit the change is read from
--again       what failed, run once more by name and judged on that run
--json        one command run on standard output once the run has ended, its log the run's own"""
dependents = """
usage: {verb} dependents [--run]

Lists the checkouts on this machine whose declarations name the repository it is run in among their
upstreams, each by its declared name and root (docs/suite.md, 「The dependents of a major change」).

--run  run each consumer's suite in turn through the suite runner, one repository at a time in the wide
       lane, and end non-zero where one failed
"""
passed = """
usage: {verb} passed [--commit <sha>] [--json]

Names the run of the repository's whole suite a deployment's gate takes in place of its own
(docs/deploy.md): the newest one in this machine's record begun on the commit, from a checkout with no
uncommitted changes to tracked files, within the policy's hours, where it passed. It runs nothing.
Exits 0 where such a run stands and 1 where none does.

--commit  the commit, the checkout's HEAD by default
--json    the test run as one JSON object (docs/boundary.md)"""
toolchain = """
usage: {verb} toolchain [--json]

Says the toolchains the checkout is built and tested with (docs/boundary.md): for each language that names
a command saying its toolchain, what that command printed in the checkout, `none` where it did not start or
did not end 0. A deployment's gate reads it to know the ground it passed on. It runs nothing else.

--json  one object, each language's name to what its command printed, or null"""
count = """
usage: {verb} count [--since <commit>]

Prints the TypeScript and Rust tests the tree holds, and with --since the tests the range removed
from the test files it changed, each accounted for by a Rust test naming its title or a commit's
Retired-test line, or not (docs/checks.md). Exits 1 where a removal nothing accounts for stands."""
log = """
usage: {verb} log <log file> [--json]

Reads a suite's log, a bun test log or a cargo test log alike: the verdict, the counts summed over
every summary block, what failed, and the units a suite never started, named apart. Exits 1 where
anything failed or never started, or where the log holds no summary.

--json  passed, failed, skipped, verdict, failed_units, unstarted_units and failures, each with its
        test and unit (docs/boundary.md)"""
template = """
usage: {verb} template make|drop|sweep <name>

make   the template made where it does not stand, by the declared migrate command; every other
       caller waits on the one making it, then finds it
drop   the template and its pool of clones
sweep  every other template made more than a day ago whose pool no living process holds, with its
       pool, and every scratch database whose process is gone"""
check = """
usage: {verb} check [--since <commit> | <file…>] [--log <path>] [--json]
       {verb} check --checkout <path>[@<rev>]… [--log <path>] [--json]
       {verb} check quick | wording | layout | dependencies | cargo-profile | personal-data | shared-versions
       {verb} check static [--since <commit>]
       {verb} check shared-versions --report
       {verb} check language [--kinds] [--settle] [<prefix>]
       {verb} check dashes <file…> [--write]

With no part named, the check a change owes, every step to its end: the enabled quick checks, the
declared static steps the change reaches, cargo check on every crate it marks, the test files it
touches, cargo test on the crates it touches itself, and the check of every tool and project it
reaches (docs/checks.md). The change is the files given, or every path changed since --since, by
default the commit the branch was made from. The output goes to one log, under the data root's
testbed/ unless --log names another; --json prints its lines on standard error, and on standard
output one command run once it has ended. Exits 1 where a step failed and 2 where the change
could not be read.

--checkout, named once for each checkout and never with --since or files, checks a change that
spans several checkouts in one call: each path is read from the directory the verb runs in, its
change since the commit after an @ where given and since its merge base with its main branch
otherwise, each planned by its own declaration, the set run on the placed machine in one wide seat,
every line of a checkout's check opening with its repository's name, and the last lines naming each
failed repository and its failed steps (docs/checks.md). Exits 2 where a checkout could not be
read, before anything runs, and 75 where the set was not run.

quick         every quick check the declaration enables
static        the static check a deployment's gate passes, alone: the quick checks, the declared
              steps the change since --since reaches, then the workspace's formatting and lints; no
              test runs
wording, layout, dependencies, cargo-profile, personal-data, shared-versions, language  that check alone
shared-versions --report  every checkout of the machine's registry held to the shared versions, each
              with its own exceptions, a line each; changes nothing
language      --settle lowers the ledger; --kinds, or a prefix, prints the lines that are not
              English by what holds them; korean names the same check
dashes        each line of the markdown files named where a dash between words would change;
              --write writes them"""
imports = """
usage: {verb} imports [<file…>] [--fix]

Finds the relative imports that resolve to nothing, in the files named or in every code file of
the checkout, and names for each the one file whose path ends the way the import's does, spelled
relative within its workspace package and by the package's name from another (docs/checks.md).
Where several files end that way, or none, it chooses none and names them. Without --fix it only
says, and exits 1 while anything is left; --fix writes every rewrite or none."""
cargo = """
usage: {verb} cargo <cargo arguments…>

Runs Cargo over the Rust workspace of the checkout it is run in, through the build directory every
checkout shares with this checkout's own crates apart in it. A command that compiles waits its
turn behind the other heavy commands on this machine, runs again where the kernel killed it for
want of memory, and once it has passed removes what this checkout's earlier build of its shape
left. Exits with Cargo's own code, 75 where the turn did not come."""
prune = """
usage: {verb} prune [--dry-run] [--older-than <days>] [--incremental-older-than <hours>]
       {verb} prune --all

Removes from the shared Cargo build directory what no build stands on any more: a checkout's own
units no live checkout's record names, other units no build read for the span, incremental state
unchanged for its span, and the target directories of checkouts that are gone, holding Cargo's
build lock in every profile directory at the front of its line; then the target directory of every
deployment's build tree last deployed more than {build_days} days ago (docs/deploy.md).

--dry-run                 says what it would remove and removes nothing
--older-than              days a unit no build read is kept, more than one (default {days})
--incremental-older-than  hours unchanged incremental state is kept (default {hours})
--all                     clears the whole directory but its lock files; every checkout then
                          builds afresh"""

full = """
usage: {verb} full [--due <HH:MM>]

Starts the daily whole run of the repository in a unit of its own and ends (docs/suite.md): the main
branch's head in a tree of its own, set up, the static check, then every unit. A run that fails sends a full-suite-failed event. Inside its unit it runs to its end
and exits 1 where it failed; a second run meeting one at work is refused with 2.

--due  start only where no run started since that time of day, local time"""
deploy = """
usage: {verb} deploy [--commit <sha>] [--message <why>] [--dry-run] [--no-check] [--before-start <command>] [--force-live]

Puts a commit of the repository live (docs/deploy.md): the checkout's HEAD, or the commit named,
gated by the static check and the suite, backed up, built into a release of its own, flipped onto,
its services restarted and watched, and rolled back where they do not come up. Outside a
deployment's unit it starts one, prints its name and how to read its journal, and exits 0.

--commit        the commit to put live, which the remote must hold
--message       the reason this deploy is made, written into the record and the event; the commit's
                subject where none is given
--dry-run       say what would be done, here, and change nothing
--no-check      leave the gate out, where the caller already ran it
--before-start  a command run between the bot service's stop and its start
--force-live    go on at once past the declared quiet command where work stands under way, cutting it,
                or where it could not tell"""
backups = """
usage: {verb} backups

Sends every backup a deployment took and the remote does not yet hold, reads each back to match its
size and checksum, and rotates them there and here (docs/deploy.md). Exits 1 where any failed to
send, the rest sent all the same."""
backup = """
usage: {verb} backup snapshot
       {verb} backup media
       {verb} backup drill
       {verb} backup prune [--dry-run]

Backs up the databases and data folders the settings file names (docs/backup.md), the file being
backup.toml under the data root's env folder.

snapshot   every database dumped and the data folders packed, sent to each destination's hourly
           slot and the day's folder, the release archives beside them, then the rotation
media      each media set and the large files packed as an archive of its own and sent
drill      the newest snapshot any destination holds restored into scratch databases, its rows
           counted against its manifest
prune      the rotation alone; --dry-run says what it would remove

Exits 1 where any step failed, the rest done all the same, 2 where the settings do not read, and 75
where another run of the same word holds the lock."""
placed = """
usage: {verb} placed [--setup] [--checkout <path>…] -- <command…>

The far side of a run another machine placed here (docs/boundary.md): run in the bench by that
machine over ssh. With --setup the declared setup steps run first, in order; the words then run as
a command of their own, marked so they are never placed again, and this verb ends with their code.

--setup     the declared [test].setup steps first, in the bench
--checkout  a checkout the run knows here, the bench and each tree copied beside it; named once each"""
crate_tests = """
usage: {verb} crate-tests record <record> <executable> [<argument>…]
       {verb} crate-tests run <record> <package>

The suite's own two halves of a crate's tests (docs/boundary.md). record is Cargo's runner while the
suite builds: it runs nothing, writes the executable, its arguments, its folder and the variables
Cargo set for it into the record as one line, and exits 0. run runs every executable the record
names for the package, in order, each to its end, from its folder and with its variables, and exits
with the first failing one's code."""
serve = """
usage: {verb} serve [--listen <address>] [--token <token>]

Serves the HTTP service until it is stopped (docs/boundary.md): the record's test runs,
deployments, log lines and restarts and the lanes as they stand, read-only, with one event stream,
behind a bearer token.

--listen  the address to serve at (default {listen})
--token   the bearer token every route takes (default BMO_TESTBED_TOKEN)"""
mcp = """
usage: {verb} mcp [--service <url>] [--token <token>]

Serves the harness plugin's MCP server on standard input and output (docs/boundary.md): its reading
tools call the HTTP service, and its running tools start this binary's run, check and suite in the
checkout named.

--service  the HTTP service's address (default BMO_TESTBED_SERVICE, else http://{listen})
--token    the service's bearer token (default BMO_TESTBED_TOKEN)"""
notice = """
usage: {verb} notice <event>

Tells the owner's supervisor of an event, taken as a hook takes it (docs/boundary.md): the event's
name the word, its payload as one JSON object on standard input. The event is queued at the
receiver's owner notices, the receiver found through RECEIVER_ADDRESS and RECEIVER_TOKEN, else the
data root's env/receiver.env. It is the placed machine's event hook where none is named.

Exits 0 once the notice is queued, 1 where the receiver is not found, does not answer or refuses,
the event then written on standard error, and 2 where the payload does not read."""

# What `classify` answers: `light`, or `heavy` with {language} the language that claims the command
# and, on the line after it, `instead` with {testbed} the running binary and {words} the command's words.
[classify]
light = "light"
heavy = "heavy {language}"
instead = "{testbed} run -- {words}"
# A `--takes-turn` value that holds no command the shell reads, {command} as given.
unread = "classify: --takes-turn {command} holds no command the shell reads"
# How deep text run as commands inside text run as commands is read; deeper text is no command.
depth_most = 3

# A checkout of the testbed running its own binary (docs/boundary.md, 「The binary」): {code} its build
# ended with, and {binary} and {why} where the built one could not be started.
[own]
unchecked = "check: this checkout's bmo-testbed did not build (exit {code}), so nothing was checked"
untouched = "template: this checkout's bmo-testbed did not build (exit {code}), so no template was touched"
unstarted = "bmo-testbed: {binary} could not be run: {why}"

# What `log` says: {path} the log, {count} how many, and the counts by name joined by `joiner`.
[log]
# The thin answer keeps back this share of the answer's ceiling, as its divisor, for the units never
# started; the failures take what is left past the head.
unstarted_divisor = 4
missing = "{path} does not exist"
no_summary = "{path} has no summary: the run is still going, or the log was cut short"
failures = "{count} failure(s) the log names:"
unstarted = "{count} unit(s) the run never started, so nothing of them was tested:"
item = "  {name}"
count = "{name} {count}"
joiner = " · "
unit = "names"
how = "read the log itself for the rest."

# What `check` and its parts say: {why} what a change or a part came to, {part} a quick check the
# declaration does not enable, {ledger} the ledger settled, {lowered} and {kept} its files.
[check]
unread = "check: the change could not be read: {why}"
server_down = "check: the test database server is not up, so the crates' tests will fail on it: {why}"
not_enabled = "check: the declaration does not enable {part} ([check] quick)"
settled = "settled {ledger}: {lowered} files lowered, {kept} still hold Korean"
unsettled = "korean: {why}"
# A checkout of a change check over several checkouts that does not read: {word} the word given, {since} the
# since that names no commit.
no_checkout = "check: {word} names no checkout"
twice = "check: {word} names a checkout another --checkout already names"
no_commit = "check: {word}: {since} names no commit"
not_ancestor = "check: {word}: {since} is not an ancestor of the checkout's HEAD, and a placed bench holds the history of HEAD alone"

# What `check dashes` says: {path} a file, {count} lines, {line} a line's number and {text} it before
# and after.
[dashes]
file = "{path}: {count} line(s)"
before = "  {line}- {text}"
after = "  {line}+ {text}"
none = "no dash to change"
written = "{count} line(s) written"
can = "{count} line(s) can change; --write writes them"
missing = "no such file: {paths}"
unreadable = "{path}: {why}"

# What `imports` says: {file}, {line} and {spec} where an import stands, {to} what it becomes, {tail}
# the end of its path, {count} and {candidates} the files that end that way, and {files} how many files.
[imports]
to = "{file}:{line}  \"{spec}\" → \"{to}\""
missing = "{file}:{line}  \"{spec}\": no file ends in {tail}"
ambiguous = "{file}:{line}  \"{spec}\": {count} files end in {tail}, so none was chosen: {candidates}"
clean = "no relative import is left unresolved"
not_files = "not files of this checkout: {paths}; give paths from the checkout's root"
not_checkout = "{root} is not a git checkout: {why}"
refused = "{count} import(s) could not be chosen for{nothing}; fix them by hand, or ask again without those files"
nothing_written = ", so nothing was written"
# Why a fix wrote nothing where any repair was refused.
none_written = "a repair was refused, so nothing is written"
to_fix = "{count} import(s) to fix ({files} file(s)); write them with --fix"
fixed = "{count} import(s) fixed ({files} file(s))"
unit = "imports"
how = "ask again over fewer files."

# What a value clap reads for a verb is refused with where it does not read.
[words]
not_named = "it names nothing: give a value that is neither empty nor a flag"
not_a_time = "it is no time of day: give it as HH:MM"

# What `backups` says: {dir} the backup directory.
[backups]
none_declared = "the declaration names no [deploy.backup], so there are no backups to send"
local_only = "the declaration names no remote, so the backups in {dir} stay on this machine"
holder = "backups"
locked = "backups: waiting for another run's upload to end"

# What `passed` says (docs/boundary.md, 「The verbs」): {id} the test run, {commit} a short commit, {when}
# when it began, {checkout} where it ran, {log} its log, {hours} the policy's hours, {named} the commit as
# given.
[passed]
found = "passed: test run {id} passed the whole suite on {commit} from a clean tree, begun {when} in {checkout}; its log is {log}"
none = "passed: no run of the whole suite on {commit} from a clean tree begun within {hours} hours passed in this machine's record"
no_commit = "passed: {named} names no commit of this checkout"

# What `prune` says (docs/deploy.md, 「The Cargo build directory」): {root} the build directory, {what}
# what it takes, {verb} whether it was removed, the counts of what it took, {checkouts} the checkouts'
# target directories, the disk's {before} and {after}, and the directory against its ceiling.
# The ceiling and its enforcement: {ceiling} the ceiling, {set} the setting, {fits} what the filesystem leaves
# the directory with {room} free, {held} and {after} what it holds before and after, {over} how far over it
# stands, {rule} a rule of the enforcement with the {count} it removed, {named} the removals it names and their
# {size}, and {holders} what holds what is left, each {path} held {by} with its {size}.
[prune]
gone = "prune: {root} does not exist, so there is nothing to remove"
noatime = "prune: the disk {root} stands on keeps no access times (noatime), so what no build read cannot be told"
too_short = "prune: --older-than takes a number of days above {days}, since the disk moves a read's time only once it is a day old"
no_hours = "prune: --incremental-older-than takes a number of hours above 0"
locked = "prune: waiting for Cargo's build lock in {profile}, which a build holds"
everything = "everything but its lock files"
spans = "own units no live checkout's record names, other units unread for {days} days, incremental state unchanged for {hours} hours"
heading = "prune: {root}, {what} {verb}"
removed = "removed"
dry = "(nothing removed)"
counts = "  {units} units, {incremental} incremental directories, {loose} loose files, {checkouts} checkout target directories{named}{cleared}, {stray} stray checkout target/ directories"
named = " ({names})"
cleared = ", {count} other entries"
bytes = "  about {size} of disk"
free = "  disk free {before} → {after}"
held = "  holds {held} of its ceiling {ceiling}"
gigabytes = "{size} GB"
over = "The shared Cargo build directory {root} holds {held} after its prune, over its ceiling of {ceiling}, and what is left is held: {holders}."
ceiling = "  ceiling {ceiling}: {set}{fits}"
ceiling_named = "{set} as BMO_CARGO_TARGET_CEILING_GB names it"
ceiling_policy = "the prune policy's {set}, BMO_CARGO_TARGET_CEILING_GB naming none"
ceiling_within = ", within the {fits} its filesystem leaves it with {room} free"
ceiling_lowered = ", lowered to the {fits} its filesystem leaves it with {room} free"
enforce_heading = "prune: {over} over its ceiling, rebuildable output by least recent read until under, {verb}"
enforced = "  {count} {rule}{named}, about {size}"
enforced_held = "  holds {held} → {after} of its ceiling {ceiling}"
still_over = "  still {over} over its ceiling, what is left held: {holders}"
holder = "{path} by {by}, about {size}"
no_holder = "nothing the enforcement may remove is left"
shared_units = "shared units"
checkout_units = "live checkouts' own units"
checkout_dirs = "live checkouts' target directories emptied but their locks"
deployment_units = "deployments' checkouts' own units"
deployment_dirs = "deployments' checkouts' target directories emptied but their locks"
by_build_lock = "a build's lock"
by_deployment = "a running deployment"
by_program = "a program built there running"
by_deployment_checkout = "a deployment's checkout, which the prune keeps"
# The deployments' build trees (docs/deploy.md, 「The releases」): {days} their span, {count} and {named} the
# deploy roots whose target directories went, {target} one that did not and {why} what it came to.
build_heading = "prune: deploy build trees' target/ directories, last deployed over {days} days ago with no deployment running, {verb}"
build_counts = "  {count} target directories{named}, about {size} of disk"
build_not_removed = "  {target} not removed: {why}"
registry_unread = "  the checkout registry does not read, so no deploy root was looked at: {why}"
# The trim after the prune (docs/deploy.md, 「The Cargo build directory」): {path} the build root, {said} what the
# trim command said, its own line where it ran and why it did not where it did not.
trimmed = "prune: trimmed the filesystem holding {path}: {said}"
trim_failed = "prune: the filesystem holding {path} was not trimmed: {said}"
trim_failed_summary = "The filesystem holding the shared Cargo build directory {path} was not trimmed after its prune, so the blocks it freed stay with its disk: {said}"
# The placed machine's free disk (docs/deploy.md, 「The Cargo build directory」): {machine} its label, {floor}
# the floor, {path} a path as the settings name it, {source} the filesystem holding it by its source (the drive
# itself for a WSL drive mount), {free} its free space, {said} what `ssh` said, and {disks} the disks below the
# floor with their free space.
placed_heading = "prune: free disk of the placed machine {machine}, against its floor of {floor}"
placed_free = "  {path} on {source}: {free} free"
placed_low = "  {path} on {source}: {free} free, below the floor"
placed_unread = "  {path}: its free space does not read"
placed_unreached = "  the placed machine cannot be reached ({said}), so its disk was not read"
placed_disk = "{source} at {path} with {free} free"
placed_low_summary = "The placed machine {machine} has less than {floor} free on {disks}."
