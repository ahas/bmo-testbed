# The set's versions (bmo-chat's docs/conventions.md, 「Versions」; docs/deploy.md, 「The deployed version」): how
# a release is tagged, how a deployment between releases is named, and how its build is handed that name.

# The platform's time zone, Asia/Seoul, as its distance from UTC in minutes; it keeps no summer time, so the
# day a nightly names is the same all year.
platform_offset_minutes = 540
# What a release tag puts before the version.
tag_prefix = "v"
# The pre-release a nightly's day follows: its numeric `0` orders every nightly before every alpha, beta and
# release candidate of the same version.
nightly = "0.nightly"
# The pre-release word of an alpha: main leads to the alpha's own version while one is its last release.
alpha = "alpha"
# The pre-release words a release tag's version may carry besides the alpha's; any other names no release.
releases = ["beta", "rc"]
# The lowest major a release tag names: the set's first release is 1.0.0, so a tag below it is no release.
first_major = 1
# The variable the deployment hands its version to every build and step in.
variable = "BMO_VERSION"
