# What the install verb says (docs/install.md): its usage, the detail and the next step of each line it prints,
# and its refusals. An agent reads them, so they are English. Each `{name}` is filled in with what it names.

usage = """
usage: {verb} install --preset <name> [--with <repository>]… [<places>] [--dry-run]
       {verb} install --add <repository> [<places>] [--dry-run]
       {verb} install --status [<places>]
       {verb} install --set <input> [<places>]

<places>: [--index <dir>] [--data-root <dir>] [--prefix <dir>] [--postgres-host <host>]
          [--postgres-port <port>] [--valkey <address>]

Installs a set of repositories onto this machine, or continues an install that stopped (docs/install.md): the
preset's repositories cloned into the index checkout, the programs they need checked, their tokens, databases and
settings made, each one's first release put live and its after-steps run, and every health read. Each step prints
one JSON line, its step, status (ok, planned, needs-input, failed), detail and next. Nothing is asked on the
terminal: a missing value is a needs-input line naming the command that gives it.

--preset     the preset of the index's presets.toml to install
--with       the repository chosen for one of the preset's choices; once for each choice
--add        one more repository, into the install the data root holds
--status     each installed repository's checkout, deployed commit and health; changes nothing
--set        an input's value, read whole from standard input, kept where its declaration says
--index      the index checkout; BMO_INDEX, else the checkout the verb runs in, where neither is given
--data-root  where settings, tokens, inputs and the install's own state are kept, over BMO_DATA_DIR
--prefix     where every repository's deploy root and data root stand; .local/share under the home
--postgres-host, --postgres-port  the PostgreSQL server, over PGHOST and PGPORT
--valkey     the Valkey the console keeps sessions in, over BMO_INSTALL_VALKEY
--dry-run    read everything and change nothing: every step that would act says planned

Exit codes: 0 done, 1 a step failed, 2 refused, 3 waiting for input."""

upgrade_usage = """
usage: {verb} upgrade [--nightly] [--index <dir>] [--data-root <dir>] [--prefix <dir>] [--dry-run]

Moves the install the data root holds to a newer state of the set (docs/install.md, 「Upgrading: `upgrade`」):
every checkout of the install fetched and moved forward to the newest release tag, or with --nightly to the head of
its main branch, never over changes or a diverged branch; then every installed repository deployed in the install's
order, waiting for quiet, and the run stopped at the first that does not go live. Each step prints one JSON line, as
install does. Run it outside the services it restarts: by a person, or an agent in a terminal of its own.

--nightly    the head of every main branch, the day's nightly, over the newest release tag
--index      the index checkout; BMO_INDEX, else the checkout the verb runs in, where neither is given
--data-root  where the install keeps its own state, over BMO_DATA_DIR
--prefix     where every repository's deploy root stands; .local/share under the home
--dry-run    fetch nothing and move nothing: every move and deployment says planned

Exit codes: 0 done, 1 a step failed, 2 refused."""

[numbers]
# How often, in seconds, the wait for a deployment's unit asks whether it still runs. A pace, never a bound.
deployment_poll_seconds = 5
# The bytes of a token made where its declaration names none.
token_bytes = 32
# The characters of what a command said that a line quotes.
quoted_chars = 400

