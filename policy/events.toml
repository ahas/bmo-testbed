# What the testbed says of the events it sends (docs/boundary.md, 「Events」): the payload's shape, how long
# a hook is given, and the lines a verb writes where the hook did not take an event, {event} its name. A
# harness reads the words, so they are English.

version = 1
# How long a hook is waited for before its process group is ended, in seconds.
hook_seconds = 60

[lines]
# No hook is named, so the event is written here, {payload} as one line of JSON.
unhooked = "event: {event} {payload}"
# The hook could not be started, or ended on its own code, {why} what it came to.
failed = "event: the hook for {event} failed: {why}"
# The hook ran past its time and was ended, {seconds} the time it was given.
overran = "event: the hook for {event} ran past {seconds} seconds and was ended"

# What `notice` sends and says (docs/boundary.md, 「`notice`」): an event queued for the owner's supervisor through
# the receiver's owner notices, the receiver found as its own tools find it.
[notice]
# The notice's code, {event} the event's name; the receiver reads the word before the colon as its publisher.
code = "testbed:{event}"
# The receiver's route for a notice to the owner.
route = "/owner/notices"
# The receiver's own env file under the data root, and the two variables read from the environment or out of it.
env_file = "env/receiver.env"
address_variable = "RECEIVER_ADDRESS"
token_variable = "RECEIVER_TOKEN"
# How long the receiver is given to answer, in seconds.
seconds = 20
# How many characters of a refusal's body are quoted.
quoted_chars = 300

[notice.lines]
# The receiver queued the notice, {id} the row it was queued as.
queued = "notice: {event} queued for the owner's supervisor as notice {id}"
# Neither the environment nor {file} names {variable}.
unfound = "notice: {event} not sent: neither the environment nor {file} names {variable}"
# The payload on standard input is not one JSON object.
unread = "notice: {event} not sent: the payload on standard input is not one JSON object: {why}"
# The receiver could not be asked, {address} where it was asked.
unreached = "notice: {event} not sent: the receiver at {address} did not answer: {why}"
# The receiver answered with a refusal, {status} its status and {said} the start of its body.
refused = "notice: {event} not sent: the receiver answered {status}: {said}"
