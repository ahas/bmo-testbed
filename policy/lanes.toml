# What the machine's turn for heavy commands says and the numbers it keeps to (docs/testbed.md, 「The
# turn」): the lines a waiter writes while it stands in a lane's line, and what a caller says once its
# turn is settled. A harness reads the words, so they are English. Each `{name}` is filled in with what it names.

# Every lane's turn, by lane.
[lanes]
wide = "the machine's turn"
narrow = "the narrow lane's turn"

# The turn's and the run's own numbers (docs/testbed.md, 「The turn」 and 「The result」).
[numbers]
# How often a waiter says where it stands, and how often a waiter looks at the line. A waiter waits for its
# turn however long the line takes.
notice_seconds = 30
poll_milliseconds = 500
# How often the watch on a harness holding a turn looks whether the harness is still there.
watch_seconds = 2
# How many failure lines a run's result keeps, how many lines of a failed test's panic stand under its name,
# and how many days a run's log is kept.
failure_lines = 60
panic_lines = 8
log_keep_days = 7
# The narrow lane's width: the machine's width divided by this, never less than one.
narrow_divisor = 4
# The wide lane's seats, and the gigabytes of memory that have to be available before a seat is taken
# beside one already held (docs/testbed.md, 「The lanes」 and 「Memory」).
seats = 3
seat_free_gigabytes = 4
# How long a command holding a turn may neither write nor work before it is ended as hung, how long it is given
# to end once sent a TERM before whatever still stands is sent a KILL, how often its output and its processor
# time are looked at, and the share of one processor, in percent, its processes have to use between two looks
# to count as working (docs/testbed.md, 「A holder whose command falls silent lets go」).
silence_seconds = 600
silence_grace_seconds = 10
silence_look_seconds = 3
working_share_percent = 10
# How many of the processes still standing under a command ended as hung its line names, and how much of each
# one's command line.
hung_named_processes = 4
hung_process_chars = 200
# How long a process waits for the lock every bringing of the placed machine's testbed to the live release holds;
# how long `status` gives the placed machine to answer before it says it does not; and how often a placed run
# whose output has not come back says it still runs there (docs/testbed.md, 「A run on another machine」).
placed_lock_seconds = 300
status_connect_seconds = 10
# How often a command run on the placed machine over `ssh` asks the connection to answer, and how many asks in a
# row may go unanswered before `ssh` ends it as broken: a connection that died under a silent command is found
# within two minutes and the run passes on (docs/boundary.md, 「The placed machine」).
alive_seconds = 30
alive_misses = 4
placed_standing_seconds = 60
# The share of the machine's threads, in percent, at or above which its load figure makes it loaded, so it takes
# no run wherever it stands in a placement order (docs/testbed.md, 「A run on another machine」). A run in the
# wide lane expects a seat's share of the threads, one third of them with the three seats here, so a machine
# standing loaded has less than that left free: two thirds of its threads already at work.
loaded_percent = 67

# How a command killed for want of memory is run again (docs/testbed.md, 「Memory」): how long it waits
# before it looks at the memory at all, how many gigabytes have to be available, how often it looks, and
# how often it says it is still waiting, and how many runs it is given in all, the first included. It waits
# for the memory however long that takes.
[memory_limits]
settle_seconds = 30
needed_gigabytes = 6
poll_seconds = 5
notice_seconds = 60
runs = 4

[waiting]
# Said every half minute while a {command} waits for {lane}, {seconds} so far, {ahead} standing ahead of
# it, and {holder} one of `nobody` or `held_by`.
line = "testbed: {command} waiting for {lane} ({seconds}s so far): {ahead} ahead, {holder}"
nobody = "nobody holding it yet"
# Who holds the lane's seats, {who} each holder as `entry` names it, once however many seats it holds,
# joined by `between`.
held_by = "held by {who}"
between = "; "

# Where an entry stands: its harness's place, its checkout and its command joined by `joiner`, or `pid` where
# it names none of them.
[entry]
joiner = " · "
pid = "pid {pid}"

[settled]
inside = "inside the turn its caller holds"
own = "taken after {seconds}s waiting on other heavy commands on this machine"
# A turn not had because the harness its caller ran for went away while it waited, {holder} one of `nobody`
# or the waiting `held_by`.
queued = "not had: the harness it waited for went away after {seconds}s, {ahead} ahead, {holder}"
nobody = "nobody holding it"

# A heavy run placed on another machine (docs/testbed.md, 「A run on another machine」), {machine} the
# machine the placement endpoint named.
[placed]
# The endpoint gave no answer that reads, {endpoint} where it was asked and {why} what it came to.
local = "testbed: the placement endpoint {endpoint} gave no answer ({why}); running here"
# What dropped a run before it ended, each the {said} of `run.dropped`: a step making the bench ready,
# with {said} what the step said; a run whose stream could not be read, {why} what it came to; and a
# stream that ended with no result.
failed = "the bench could not be made ready: {said}"
unpushed = "the checkout's commit could not reach the bench: {said}"
uncopied = "the checkout's open files could not be copied: {said}"
unread = "its run could not be read: {why}"
no_result = "its run ended with no result"
running = "testbed: running on {machine} in {bench}"
# Said every `placed_standing_seconds` in which none of a placed run's output came back: {machine} the machine,
# {seconds} how long since the run went there.
still_running = "testbed: still running on {machine} ({seconds}s so far)"
# The placed machine the settings name (docs/boundary.md, 「The placed machine」): its settings file that does
# not read, {file} the file and {why} what it came to; the machine that cannot be reached, {said} what `ssh`
# said; an outside tree that could not be copied; a file that could not be laid over a copied tree, {file} its
# place there; the binaries that could not be read back; and the
# connection that broke once the run had begun.
unsettled = "testbed: the placement settings {file} do not read ({why}); running here"
negative_floor = "disk_free_gigabytes takes a number of gigabytes of 0 or more"
# The settings' `order` (docs/boundary.md, 「The placed machine」): the name it gives this machine, and why an
# order does not read: it names no machine, names {name} more than once, or names {name}, which is neither the
# placed machine's label {machine} nor this machine's name {here}.
here = "local"
order_empty = "order names no machine"
order_twice = "order names {name} more than once"
order_unknown = "order names {name}, which is neither the placed machine {machine} nor {here}"
# An order naming a machine where the settings name no destination, so no machine is placed: {name} the name,
# {here} this machine's name.
order_paused = "order names {name}, but the settings name no destination, so placement is paused and only {here} may stand there"
# The status line where the settings at {file} name no destination (docs/boundary.md, 「The placed machine」).
paused = "placement: paused, {file} names no destination; every run runs on this machine"
unreached = "testbed: the placed machine {machine} cannot be reached ({said})"
# A run the order sends to the placed machine before another finds it takes no run now, {why} the line its
# `status --free` gave, or `no_answer` where it gave none; the run goes on to the next machine in the order.
full = "testbed: {machine} takes no run now ({why}); going on to the next machine in the order"
no_answer = "no answer saying it takes one"
# What `status --free` says where the machine takes no run of the lane now: every seat held or waited for; or the
# machine loaded, {load} its load figure, the larger of its last-minute and last-five-minute averages, {threads}
# its threads and {percent} the share of them at or above which it is loaded.
seats_taken = "every seat of the lane is held or waited for"
loaded = "loaded: {load} on {threads} threads, at or above {percent}%"
# A failing log a placed run kept there, brought here (docs/boundary.md, 「The placed machine」): {machine} the
# machine, {path} the copy here; or not, {far} the file there and {said} what was answered.
log_brought = "testbed: the failing log kept on {machine} is brought here: {path}"
log_unbrought = "testbed: the failing log kept on {machine} at {far} could not be brought here: {said}"
tree_uncopied = "the tree {tree} could not be copied: {said}"
# A tree the declaration's [test] sibling_trees names that does not stand here: {tree} the path as written and
# {why} what reading it said.
sibling_absent = "the sibling tree {tree} the declaration names does not stand here: {why}"
file_unlaid = "the file {file} could not be laid there: {said}"
unfetched = "the binaries could not be read back from {machine}: {said}"
broken = "the connection to it broke"
# The same, as a deployment's work there names it, {machine} the machine.
broke = "the connection to {machine} broke"
# Where a deployment's work there ran, as a build that failed there names it, {bench} the bench there.
ran_there = "it ran on {machine} in {bench}"
# The benches other checkouts of a deployed repository left beside its one bench there (docs/boundary.md,
# 「A deployment's bench stands apart」): taken away, {names} their folders; or not, {said} what was said.
stale_removed = "testbed: took away the benches other checkouts of the repository left on {machine}: {names}"
stale_unremoved = "testbed: the benches other checkouts of the repository left on {machine} could not be taken away: {said}"
# A deployment's bench made ready without a tree its manifests name by a path (docs/boundary.md,
# 「A deployment's bench stands apart」): the bench is at fault and not the commit, {machine} the machine and
# {names} the trees that do not stand there; or the guard itself could not ask the machine, {said} what it said.
trees_gone = "testbed: the deployment's bench on {machine} is missing trees its manifests name by a path: {names}; the bench is at fault, not the commit"
trees_unread = "testbed: the trees a deployment's bench must hold could not be read on {machine}: {said}"
setup_failed = "testbed: the setup step {command} failed with code {code}"
no_registry = "testbed: the run's registry of checkouts could not be written at {file}: {why}"
# The `placed` verb asked to run its command in {dir}, a folder the bench {bench} does not hold
# (docs/boundary.md, 「`placed`」).
no_dir = "testbed: the bench {bench} holds no folder {dir}, where the run was started in its checkout, so it does not run"
# The placed machine's testbed is not this machine's live testbed release: {machine} the machine, {far} the commit
# its testbed was built from and {live} the live release's commit; or no commit reads there, {file} the file asked
# for and {said} what reading it came to.
stale = "the testbed on {machine} is the release of {far}, not the live release {live}"
unreleased = "the testbed on {machine} names no release ({file}: {said}), not the live release {live}"
# The placed machine's testbed not brought to a release (docs/deploy.md, 「Where a deployment runs」): the machine
# that cannot be reached, {said} what `ssh` said; a file that could not be written there, {file} its place there; a
# `built-from` read back that names none, {file} the file asked for; one naming {far}, not {live}, the release
# brought; a copied testbed that does not run there, {said} what running it said; or the lock every bringing
# holds, {file} the lock, not had within {seconds} seconds.
testbed_unreached = "it cannot be reached ({said})"
testbed_unwritten = "{file} could not be written there: {said}"
testbed_unread = "{file} read back names no release: {said}"
testbed_other = "its built-from read back names {far}, not {live}"
testbed_unrun = "the copied testbed does not run there: {said}"
lock_unheld = "the lock {file} was not had within {seconds}s"
# The placed machine's testbed brought to the live release before anything runs there (docs/testbed.md, 「A run on
# another machine」): {machine} the machine, {live} the live release's commit; where that does not take, {stale}
# the `stale` or `unreleased` line and {said} what the machine answered, or the live release {release} holding no
# {binary} to copy.
brought_live = "testbed: brought the testbed on {machine} to the live release {live}"
unbrought = "{stale}; it could not be brought there: {said}"
live_uncarried = "the live release {release} holds no {binary}"
# A run whose placed machine answers but whose testbed could not be brought to the live release, {said} the
# `unbrought` line; the run passes on down the order.
release_failed = "testbed: {said}; the run passes on"
# A run whose placed machine does not answer (docs/boundary.md, 「The placed machine」), {machine} the machine and
# {said} what `ssh` said; whose bench there could not be made ready, {said} why; and whose connection broke
# under it once it had begun. Each passes the run on down the order, to the next machine that takes it or here.
unreached_passed_on = "testbed: {machine} does not answer ({said}); the run passes on"
unready_passed_on = "testbed: the bench on {machine} could not be made ready ({said}); the run passes on"
broke_passed_on = "testbed: the connection to {machine} broke under the run; it starts again from its beginning further down the order"
# A deployment's gate or build whose placed machine broke under it, where the order names this machine
# (docs/deploy.md, 「A connection that breaks under the placed machine」): {machine} the machine, {work} `gate` or
# `build`, {said} what broke.
here_instead = "testbed: {machine} broke under the deployment's {work} ({said}); the {work} runs here, as the order names this machine"
# The event the first run that finds the placed machine not answering sends (docs/boundary.md, 「Events」),
# {machine} the machine.
unreachable_event = "the placed machine {machine} does not answer, so the runs placed there pass on down the order until it does"
# The placed machine answering again after an outage that was told, {since} when the outage began.
recovered_event = "the placed machine {machine} answers again, after an outage since {since}"
release_failed_event = "the testbed on the placed machine {machine} could not be brought to the live release {live}, so a run placed there did not run"
# A run kept here by {named}: a variable its declaration names as reaching what only this machine reaches, set
# in its environment, or a file its declaration names so, which its checkout holds.
kept = "testbed: {named} names what only this machine reaches; running here"
# A run kept here because it was started in {dir}, a folder its checkout ignores, which a bench copy would not
# hold (docs/boundary.md, 「Placement」).
ignored_dir = "testbed: {dir} is ignored in its checkout, so a bench copy would not hold it; running here"
# A change check over several checkouts refused by a placement that cannot run it on the placed machine
# (docs/boundary.md, 「Placement」): one carrying one checkout, and one kept here by {named}, a variable or a file
# as `kept` says, while the placed machine's combined_order does not name this machine.
set_one_checkout = "testbed: this placement carries one checkout, so a change check over several checkouts does not run; it runs on a placed machine alone"
set_kept = "testbed: {named} names what only this machine reaches, and the placed machine's combined_order does not name this machine, so a change check over several checkouts does not run"
# The line a testbed run on a placed machine writes on standard error each time a turn it takes comes there; the
# machine that placed it reads it off the run's output, takes the run for running there, and does not pass it on
# (docs/boundary.md, 「A run placed elsewhere stands here too」). Both machines run one release, so they read it
# alike.
turn_came = "testbed: placed run's turn came"

# A command's wait and run, as every step of a check says them.
[times]
line = "waited {waited}s, ran {ran}s"

# A command holding a turn ended for neither writing nor working (docs/testbed.md, 「A holder whose command falls
# silent lets go」): {command} the command, {output} where its output went, the files it went to or `piped`,
# {seconds} the silence limit, and {standing} the `standing` words where any process still stood under it,
# nothing otherwise; {processes} those processes' command lines. `working` is what the `placed` verb says over
# the connection while its command works with none of its output passing, {seconds} how long none has passed.
[silence]
hung = "testbed: {command} ended as hung: nothing written to {output} and no processor time used for {seconds}s{standing}"
standing = "; still standing under it: {processes}"
piped = "its output"
working = "testbed: {command} still works, {seconds}s with none of its output passing"

# The one result a run ends on (docs/testbed.md, 「The result」).
[run]
# A run whose turn did not come, {turn} the `settled.queued` words.
not_run = "testbed: FAILED, not run, nothing tested: the machine's turn was {turn}"
# A run that ran: {verdict} `ok` or `failed`, {language} the language that read it, {counts} the
# `counts` or the `exit` words, and {log} its log.
line = "testbed: {verdict} in {seconds}s (waited {waited}s), {language}: {counts}; log: {log}"
ok = "ok"
failed = "FAILED"
counts = "{pass} passed, {fail} failed, {skip} skipped"
exit = "exit {code}"
by_signal = "by signal"
# What failed, under the line: the heading, or the heading of a list cut at {count} lines, then each.
failures = "failed:"
failures_first = "failed (the first {count}):"
failure = "  {line}"
# A command that could not be started at all.
unstarted = "testbed: {program} could not be started: {why}"
# A run's log that could not be written.
no_log = "testbed: the log could not be written in {dir}: {why}"
# A run a placed machine dropped, {machine} the machine and {said} the last line it gave.
dropped = "testbed: not run, {machine} dropped it: {said}; run the same command again"

# The lanes and the close line, as `status` prints them.
[status]
lane = "{lane} ({width} threads):"
holding = "  holding it: {who}"
nobody = "nobody"
waiting = "  waiting {at}: {who}"
# How long ago an entry asked, or its turn came.
age = " ({seconds}s)"
front = " (at the front)"
next = " (next after the front)"
# A run this machine placed on another in the lane, {machine} the machine, {state} `placed_waiting` or
# `placed_running`, and {who} the run as a holder's line names it, with how long ago it was placed or its turn
# there came.
placed = "  placed on {machine}{state}: {who}"
placed_waiting = ", waiting there"
placed_running = ", running there"
# The placed machine the settings name (docs/boundary.md, 「`status`」): {machine} its label and {state} one of the
# states after it, {release} the commit its testbed names, {live} the live testbed release's, {said} what `ssh`
# said, {outage} the `machine_outage` words where an outage stands, nothing otherwise.
machine = "the placed machine {machine}: {state}"
machine_current = "release {release}, current"
machine_behind = "release {release}, behind the live release {live}"
machine_unreleased = "its testbed names no release, behind the live release {live}"
machine_uncompared = "release {release}; this testbed runs from no release, so nothing is compared"
machine_unreached = "cannot be reached ({said}){outage}"
# An outage the runs placed there remember, {since} when it began, as `machine_unreached` names it.
machine_outage = "; out since {since}"
close_line = "the close line:"
# The deployment line's heading (docs/deploy.md, 「The deployment line」).
deploy_line = "the deployment line:"
# Said after a waiting deployment that waits for its deploy root's turn rather than in the line.
for_root = ", for its repository's turn"

# The `run` verb's refusal of a language it does not know, {name} the name given and {names} the ones
# there are.
[verb]
no_language = "testbed: no language is named {name}; there are {names}"

# A heavy command run in its turn and run again where the kernel killed it for want of the machine's
# memory rather than at the ceiling of a fence it stands in (docs/testbed.md, 「Memory」). Every line
# opens with `mark`, so a caller can lift them out of the command's output; {what} is the command, {end}
# the `exit` or `signal` words it ended on, {code} the exit code it ends on, {run} and {runs} the run and
# the runs it is given, and {available} and {ceiling} amounts of memory in gigabytes.
[memory]
mark = "memory turn:"
not_run = "{what} not run: the machine's turn was {turn}"
took = "{what} took the machine's turn after {seconds}s waiting on other heavy commands on this machine"
unread = "the available memory cannot be read; running {what} again"
freed = "{available} available; running {what} again"
short = "only {available} available after {minutes} minutes; {what} waits for more before it runs again"
fenced = "FAILED: {what} failed ({end}) while the fence it stands in, {fence}, reached its {ceiling} memory ceiling; the same run meets the same ceiling again, so it does not run again"
spent = "FAILED: {what} failed while the kernel killed a process for want of memory on all {runs} runs; the code was never judged, so run it again once the machine has memory to spare"
again = "{what} failed ({end}) while the kernel killed a process for want of memory (run {run} of {runs}); this is not taken for the change failing, and it runs again once memory frees"
killed = "FAILED: {what} was {end}, which nothing took for a kill for want of memory; it ends on exit {code}"
times = "{what} {times}"
exit = "exit {code}"
signal = "killed by signal {signal}"
