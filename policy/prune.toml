# The numbers of the prune of the shared Cargo build directory (docs/deploy.md, 「The Cargo build
# directory」). Each key names its unit.

# The span a unit no build has read is left alone for where `--older-than` names none, in days; an entry
# of a build's own record no build has swept for as long goes too, and a checkout whose record is older is
# taken for one gone.
older_than_days = 2

# The span `--older-than` must exceed, in days: a relatime disk moves a file's access time on a read only
# once it is a day old, so a shorter span would take a unit read hours ago for one unread.
relatime_days = 1

# The span incremental state is left alone for where `--incremental-older-than` names none, in hours: a
# session is written as its build ends and never again, so its modification time says when it was made.
incremental_hours = 3

# How long a unit of a checkout's own crates that no record names is left alone after it was built, in
# hours: a build that failed leaves such units, and its harness mends it and builds again within that.
own_grace_hours = 12

# How long a deployment's build tree keeps its target directory after the last deployment was laid down, and a
# checkout's directory under the build root stays a deployment's checkout after a deployment last built there,
# in days (docs/deploy.md, 「The releases」, 「The Cargo build directory」).
deploy_build_days = 3

# The build directory's ceiling where `BMO_CARGO_TARGET_CEILING_GB` names none, in gigabytes of a thousand
# million bytes: one size whatever the number of checkouts, since a checkout is made for each piece of open
# work and a ceiling growing with them bounds nothing on a disk of fixed size.
ceiling_gigabytes = 200

# The free space the ceiling always leaves on the filesystem holding the build directory, in gigabytes of a
# thousand million bytes: room for the builds of one prune's span and a deployment's release build beside
# them.
ceiling_room_gigabytes = 50

# The deployments' checkouts' own ceiling where `BMO_CARGO_TARGET_DEPLOYMENT_CEILING_GB` names none, in gigabytes
# of a thousand million bytes; 0 sets none, which leaves them to the build directory's ceiling alone, since
# whatever a prune takes from a deployment's checkout its next deployment compiles again from cold.
deployment_ceiling_gigabytes = 0


# How long after the last prune ended a prune run with `--when-due` runs whole whatever the directory holds, in
# hours (docs/deploy.md, 「The Cargo build directory」): the cadence its rules counted in days and hours run at,
# while its timer reads the directory against its ceiling every few minutes.
due_hours = 2

# How long after the last trim began the prune trims its filesystem again, in hours: a trim takes every free
# block whatever freed it, and runs for minutes on a large disk, so the frequent prunes share one.
trim_hours = 2


# The trim run once a prune that is not a dry run is done, the build root handed to it as its last word
# (docs/deploy.md, 「The Cargo build directory」): fstrim needs root, and `-n` keeps sudo from waiting on a
# password a timer cannot give.
trim_command = ["sudo", "-n", "fstrim", "--verbose"]

# The free space below which a disk of the placed machine sends `placed-disk-low` where its settings name no
# other floor, in gigabytes of a thousand million bytes (docs/deploy.md, 「The Cargo build directory」):
# room for the builds of one prune's span and a deployment's release build beside them.
placed_disk_free_gigabytes = 50
