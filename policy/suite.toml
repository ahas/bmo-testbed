# What a run of the suite says (docs/suite.md): the selection it opens with (docs/checks.md, 「Which
# tests a change runs」), the lines it writes about itself, each unit's result and the verdict it ends on.
# A harness and the readers of a suite's log read them, so they are English, and the lines a reader parses —
# each unit's mark, the summary of what failed, and the verdict — keep their shape. Each `{name}` is filled
# in with what it names. Its numbers, the fence's, the test server's, the superseded removal's and the change
# check's, stand under `[numbers]`.

# The numbers a run and the change check hold to. Each key names its unit.
[numbers]
# What one Cargo job of the workspace takes at its peak, in tenths of a gigabyte: the largest crate
# compiled, or one of a crate's test binaries linked with every dependency whole. The fence's memory over
# it is how many Cargo jobs a run builds at.
build_job_tenths_gb = 15
# The fence's ceilings beside its memory (docs/suite.md, 「The fence」): the swap beyond it and the tasks.
fence_swap_gb = 1
fence_tasks = 8192
# How the run waits for its own control group to name the scope it was moved into, since the manager
# answers before the move is carried out: how far apart it looks, and how many looks it takes before it
# runs where it is.
fence_move_poll_ms = 50
fence_move_tries = 40
# The suite's own test server once started: how far apart it is asked whether it answers, until it does or
# its unit is no longer coming up.
server_start_poll_ms = 500
# How many lines of a failing static step's output the change check prints; the rest is in its log.
check_shown_lines = 40

# The variables no test unit inherits (docs/suite.md, 「What a test unit is handed」): the deployment's own,
# naming the live data root, the backups, the deployment record and the markers of the run underneath it. A
# test reads its own environment; what the deployment was handed reaches the suite's process alone. A
# variable the suite names for a unit itself — the turn it holds, the test server, the template — is handed
# after this list is taken away.
[environment]
stripped = [
  "BMO_DATA_DIR",
  "BMO_BACKUP_DIR",
  "BMO_DEPLOY_PROGRESS",
  "BMO_DEPLOY_UNIT",
  "BMO_TESTBED_EVENT_HOOK",
  "BMO_TESTBED_FRONT",
  "BMO_UNIT",
]

# What a run is named in the machine's line.
[run]
whole = "the whole suite"
selected = "the selected suite"

# Why a package or a crate was marked.
[reasons]
owner = "holds {path}"
root = "root configuration {path}"
reads = "reads {path} ({glob})"
unclaimed = "{path} is in no package and read by none"
runs = "runs {launched}"
runs_loading = "runs {launched}, which loads {path}"
dependent = "depends on {on}"
always = "always"

# What a selected run says first: {marked} of {packages}, then a line for every package, project of its
# own, tool checked by its manifest and crate, marked or not, with the first reason and how many {more}
# there were.
[selection]
heading = "selected {marked} of {packages} packages:"
unmarked = "  -  {name}"
marked = "  +  {name}: {reason}{more}"
more = " (+{count} more)"
project_unmarked = "  -  {dir}/ (its own project)"
project_marked = "  +  {dir}/ (its own project): holds {path}"
tool_unmarked = "  -  {dir}/ (its manifest's check)"
tool_marked = "  +  {dir}/ (its manifest's check): holds {path}"
crate_unmarked = "  -  {dir}/ (crate)"
crate_marked = "  +  {dir}/ (crate): {reason}"
changed = "{count} paths changed since {since}"
no_packages = "this checkout declares no workspace packages, so there is nothing to select among and every file runs"
not_a_range = "--since {since} is not a commit this checkout can read a range from: {why}"
no_crates = "the Rust workspace's crates could not be read, so none of them is tested: {why}"

# The test database's template (docs/suite.md, 「The test database」): how long a template another has
# taken the place of is kept for the runs still on it, and what the `template` verb says where it cannot
# do what it was asked, {name} the name given, {code} and {said} how the migrate command ended.
[template]
superseded_kept_seconds = 86400
bad_name = "template: {name} is not a database name this verb writes: lower-case letters, digits and underscores, not opening with a digit"
no_migrate = "the declaration names no migrate command to make the template with ([test.database] migrate)"
migrate_failed = "the migrate command ended with {code}: {said}"
failed = "template: {why}"

# A run judged once more (docs/suite.md, 「What failed runs once more」): {count} files and units and
# {names} them, what failed in either run where the second failed too, the event's summary of {count}
# flaky tests in {repository}, and a record that could not be written, {why} what it came to.
[again]
once_more = "{mark} once more, {count} that failed or never started: {names}"
either = "{mark} failed in either run: {names}"
joiner = ", "
flaky_summary = "{count} tests of {repository} passed only when run once more"
unrecorded = "{mark} the flaky tests could not be written down: {why}"

# The lines a run writes about itself, each opening with {mark}, the word a caller finds them by.
[lines]
mark = "suite:"
turn = "{mark} turn: {words}"
cargo_jobs = "{mark} cargo: {jobs} jobs, what the fence holds"
fence_none = "{mark} fence: none, running where it stands: {why}"
fence_held = "{mark} fence: {unit}, memory {memory} GB, swap {swap} GB, {tasks} tasks"
fence_refused = "the service manager refused the scope: {said}"
fence_not_moved = "{unit} was started but the run was not moved into it"
# Processes the files left in the run's scope, {count} of them, each {pid} and its {command} or `gone`.
fence_killed = "{mark} fence: killed {count} {processes} the files left in {unit}: {named}"
process = "process"
processes = "processes"
gone = "(gone)"
no_runtime = "no runtime directory is named, so the user's service manager cannot be reached"
no_socket = "the runtime directory {runtime} holds no socket of the user's service manager"
# The test database (docs/suite.md, 「The test database」).
server_down = "database: the test server is not up: {why}"
on_postgres = "database: the database tests run on PostgreSQL, each file on a clone of {template}"
template_stands = "database: the template stands"
template_failed = "database: the template could not be made: {why}"
# A Cargo build ahead of the guards: the {what} — `tests` or `library_tests` — of the {count} crates the run
# reaches, in one command; and the `binaries` of one {crate} its test files start.
building_tests = "building {what} of {count} crate(s): exit {code}"
building = "building {what} of {crate}: exit {code}"
tests = "the tests"
library_tests = "the libraries' own tests"
binaries = "the binaries"
# The plan, {browser} the declared browser globs or `no_browser`.
plan = "{count} files, {width} at a time, the browser files ({browser}) one at a time beside them, and the projects of their own, the tools checked by their manifest and the crates one at a time in a lane of their own"
no_browser = "none declared"

# One unit's result, written whole as it ends: its mark, its seconds and its name, then what it printed.
[file]
ok = "ok  "
failed = "fail"
heading = "{mark} {seconds}s  {file}"
# How a unit's process ended, under its heading where its output cannot say: the number of the {signal}
# that ended it, or the exit {code} of one that failed having said nothing.
signalled = "its process was ended by signal {signal}"
silent = "its process said nothing and ended with exit code {code}"
# A unit ended because one of its tests, {test}, ran past the per-test limit of {seconds} seconds
# (docs/suite.md, "How long a unit and a test may run").
test_overran = "the test {test} ran past the per-test limit of {seconds} s, so its unit was ended"
# A project whose manifest names no {script} script or whose script no declared language runs, and a
# tool whose {manifest} names no {key}.
no_check = "its manifest names no {script} script, so nothing of it could be checked"
no_runner = "no declared language runs its {script} script, so nothing of it could be checked"
# The change check's step running the touched test files of one {language}.
tests_step = "{language} test"
no_tool_check = "its {manifest} names no {key} command, so nothing of it could be checked"
unread_manifest = "its {manifest} does not read, so nothing of it could be checked: {why}"
# A crate whose tests the build ahead did not build, by the {code} that build ended with.
unbuilt_crate = "its tests did not build: the build of the crates' tests above ended with exit {code}"

# What the crate-tests verb says (docs/boundary.md, 「crate-tests」): the line ahead of each test binary it
# runs, a package with none written down, and a record or a binary it could not read or start.
[crate_tests]
running = "     Running {executable}"
none = "no test binary of {package} was written down, so it has no tests to run"
unread = "the record of test binaries {record} does not read: {why}"
unwritten = "the record of test binaries {record} could not be written: {why}"
unstarted = "{executable} could not be started: {why}"

# What the sweep came to, and the verdict the run ends on.
[ending]
summary = "{files} files: {passed} ok, {failed} failed"
failed_files = "failed: {files}"
verdict = "{mark} {outcome} in {seconds}s: {note}"
ok = "ok"
failed = "FAILED"
not_run = "not run: the harness it waited for went away before the machine's turn for heavy commands came, so nothing was tested"
all_passed = "{files} of {files} files passed"
passed = "{passed} of {files} files passed"
failed_count = "{count} failed"
# The tests the units skipped, by the counts their own output gave (docs/suite.md, 「A skipped test is said」).
skipped_count = "{count} test(s) skipped"
joiner = ", "
# A checkout of the testbed whose own binary did not build, by the {code} its build ended with
# (docs/boundary.md, 「The binary」).
unbuilt = "this checkout's bmo-testbed did not build (exit {code}), so nothing was tested"

# What the change check says (docs/checks.md, 「The change check」). The step lines open with `ok` or
# `FAILED`, which the readers of the check's output match, so those two words keep their shape.
[check]
# The heading: {changed} paths changed {from} `since` or `given`, then what the change touched.
heading = "check: {changed} path(s) changed ({from}); {tests} test file(s), {tested} crate(s) tested, {checked} checked, {projects} project check(s), {tools} tool check(s)"
since = "since {since}"
given = "{count} file(s) given"
# Where a step runs where it is not the root, after its name.
where = " in {dir}"
# A step as it ends: {outcome} `ok` or `failed`, {name} the step, {code} its exit, {ran} and {waited} its
# seconds.
step = "{outcome} {name} · exit {code} · ran {ran}s, waited {waited}s"
ok = "ok"
failed = "FAILED"
# The heading of a step's output in the log: {command} what it ran.
logged = "==> {name} ({command}): exit {code}"
log = "log: {path}"
# Why the touched test files did not run: {words} what the turn came to.
no_turn = "the machine's turn did not come: {words}"

# What the cargo verb says of the units a passed build superseded (docs/deploy.md, 「The Cargo build
# directory」): {why} what a call came to, {code} and {said} Cargo's exit and its last line, {count} units of
# {target} the target folder, {megabytes} what their removal freed, {command} the program.
[cargo]
not_removed = "cargo: superseded units not removed: {why}"
unasked = "asking Cargo what the build stood on ended with exit {code}: {said}"
# The exit of a Cargo that ended on a signal.
no_code = "none"
locked = "cargo: another build holds the build lock; {count} superseded units of {target} are left to the prune"
removed = "cargo: removed {count} superseded units of {target}, {megabytes} MB"
unstarted = "cargo: {command} could not be started: {why}"
# A lock whose path packages were brought to their manifests: {lock} the lock, {moves} the moves joined.
path_aligned = "cargo: {lock}: path packages brought to their manifests: {moves}"
path_moved = "{name} {from} -> {to}"
# The version of a path package not in the lock on that side.
path_absent = "none"
# The test server's stand lock not had: {dir} the server's folder, {seconds} how long it was waited for.
