# What a deployment says where its caller reads it (docs/deploy.md): the account of a rollback, and the
# account of a deployment its gate or its own run refused. A job and the readers of the deploy events
# read them, so they are English. Each `{name}` is filled in with what it names.

# The account of a deployment whose service did not come up: first why, then what the rollback came to,
# then where to read the cause (docs/deploy.md, 「Rollback」). {commit} and {to} are short commits.
[rollback]
restart_refused = "deployment failed: the service could not be restarted on {commit}."
not_answering = "deployment failed: the service on {commit} did not answer within {seconds}s of its restart."
died_after_start = "deployment failed: the service on {commit} answered and then did not stay up {seconds}s."
answers = "Rolled back to the earlier release {to}, and the service answers again."
silent = "Rolled back to the earlier release {to}, but the service still does not answer; it is down."
# Why nothing was rolled back, followed by the line after them.
first = "No release was live before, so nothing was rolled back."
before_start = "A deployment with --before-start is not rolled back by itself; a rollback by hand is an ordinary deployment of the older commit (docs/deploy.md, 「Rollback」)."
tree = "The deploy tree could not be rolled back: {detail}"
bot_down = "The service is down."
# Where the cause is read: {cause} is the journal command of the unit that did not come up.
cause = "Cause: {cause}"
# The reason the `deploy-rolled-back` event carries.
reason = "rolled back after a failed deployment: the service on {commit} did not come up, so it is back on the earlier release {back}"

# A deployment that put nothing live, {main} the main branch with its short commit.
[refusal]
check_failed = "the deployment of {main} did not pass the static check, so nothing went live."
# {files} is `files`, or nothing.
suite_failed = "the deployment of {main} did not pass the suite, so nothing went live.{files}"
files = " Failing files: {files}."
failed = "the deployment of {main} did not finish (exit {code}), so nothing went live; what stopped where is in the deploy unit's journal."
# A deployment refused while another holds the lock.
locked = "the deployment was refused, so nothing went live: another deployment is running; start it again once that one ends."

# The deployment's fixed counts and limits.
[numbers]
# How many dirty files a refusal of an unclean tree names before it says how many more there are.
dirty_shown = 10
# How many characters of what a failed command printed a line quotes.
quoted_chars = 300
# How many characters of a live process's command line a pinned release's account carries.
command_chars = 200
# How many releases may stand before a prune sends `releases-pinned`.
releases_told_above = 12
# The longest one ask of the declared health may take before it counts as no answer, in milliseconds.
health_ask_ms = 5000
# How long a wait for the health rests between asks, in milliseconds.
health_poll_ms = 500
# How often a wait for the health asks systemd whether the unit gave up starting, in milliseconds.
unit_check_ms = 5000
# How often the watch of the service staying up reads the unit, in milliseconds.
stay_poll_ms = 1000
# How many lines of a failing service's journal the deploy output keeps.
journal_lines = 40
# How often a step under way is looked at for its end and its time, in milliseconds.
step_poll_ms = 100
# How long a step that overran its time, and what it started, are given to go once asked, in seconds.
step_stop_grace_seconds = 1

# What the deploy run says as it goes (docs/deploy.md, 「What the deploy run does, in order」): {commit} a
# short commit, {release}, {path}, {dir} and {data} places, {unit} and {name} units, {said} and {why}
# what a command or a call came to, {code} an exit code, {step} a step's id.
[run]
refused = "refused: {why}"
no_deploy = "the declaration names no [deploy] root and data root, so this repository deploys nothing"
job = "a job's shell does not deploy: CLAUDE_PID names a job's process, and a deployment outlives every job's call"
data_relative = "the data root {data} is not an absolute path"
data_in_tree = "the data root {data} sits inside the git work tree at {tree}; move it out"
data_missing = "the data root {data} does not exist, so there is nothing to back up and nothing to run against"
backup_in_data = "the backup directory {backup} stands inside the data root {data}, where nothing the backup writes could be taken away again; put it outside"
backup_in_tree = "the backup directory {backup} sits inside the git work tree at {tree}; put it outside"
env_missing = "the env file {target} that {link} links to is missing, and the services cannot start without it"
fetch_failed = "git fetch failed, so what the remote has cannot be known: {said}"
no_commit = "{commit} names no commit of this checkout"
# Where a commit must stand to be deployable, as a refusal names it.
remote = "any branch of the remote"
deploying = "deploying {commit}: {subject}"
again = "{commit} is already what is deployed; laying it down again"
unit_faults = "{faults}; the reload after the flip would make that unit vanish, so put its file back or relink it in {dir} by hand first"
dry = "--dry-run: {commit} would go live over {live}; nothing was changed"
nothing_live = "nothing deployed before"
adopted = "the deploy tree {dir} was adopted into {release}; the directory retired to {retired}"
adopt_failed = "the deploy tree could not be adopted into a release: {why}; no service was touched"
gate_left_out = "the gate is left out, so no check or suite runs before the backup"
gate_failed = "the deployment of {commit} did not pass its gate, so nothing went live: {reason}"
# The gate's reason where its suite did not pass, {code} the suite's exit.
gate_suite = "the suite ended with exit {code}"
flaky = "flaky: {test} ({unit}) passed only when run once more"
backup_none = "no backup is declared, so none is taken"
backup_unnamed = "the backup could not be named: ninety-nine backups were already taken this second; nothing was changed"
backup_taken = "backup {path} taken ({bytes} bytes)"
backup_failed = "the backup failed: {failure}; {left}"
prepare_failed = "the release of {commit} could not be prepared: {why}; no service was touched"
prepared = "release {release} {how}"
made = "made afresh"
taken = "taken as it stands"
setup_failed = "`{command}` failed in {release}: {said}"
build_failed = "the build failed at {step} (exit {code}): {said}; every service is untouched"
metadata_failed = "the Cargo workspace's binaries could not be read: {why}; every service is untouched"
place_failed = "the binaries could not be placed into the release: {why}; every service is untouched"
placed = "placed {count} binaries; changed: {changed}"
before_failed = "the step {step} before the flip failed (exit {code}): {said}; nothing was flipped"
unrecorded = "the deployment record could not be written: {why}; nothing was flipped"
recorded = "recorded in {path}"
unresolved = "{links} would link to nothing in the release, so nothing was flipped and the record was put back"
flip_failed = "the deploy tree could not be flipped onto {release}: {why}; the record was put back, so what was running is still running"
flipped = "deploy tree flipped onto {release}"
relinked = "relinked {name} to {to}"
dangling = "{names} still link to nothing in the deploy tree; the units were not reloaded and no service was restarted"
set_aside = "{name} stood as a plain file; it is kept as {name}.before-deploy and linked from the tree"
link_failed = "the units could not be linked: {why}; no service was restarted"
linked = "linked {name} to {to}"
timer_failed = "{timer} could not be started; the next deployment tries again"
restarted = "{unit} restarted"
restart_failed = "{unit} did not restart; the next deployment tries again"
left_running = "{unit} left running: what it runs did not change"
no_bot = "no unit is marked bot, so no health is waited on"
stop_failed = "{unit} could not be stopped for the command run before the start, so the command was not run"
before_start = "running before the start: {command}"
# The id the command run before the start is written under in the progress record.
before_start_step = "before-start"
before_start_failed = "the command run before the start failed: {said}; {unit} is stopped, and a deployment with --before-start is not rolled back by itself"
waiting = "waiting up to {seconds}s for `{health}` to answer"
watching = "watching {unit} stay up for {seconds}s"
stayed = "{unit} came up and stayed up"
retired = "{unit} retired: stopped, disabled and unlinked"
retired_plain = "{unit} retired: stopped and disabled; it stands as a plain file, so it was left in place"
unretired = "{unit} was stopped and disabled, and its link could not be taken out: {why}"
after_failed = "the step {step} after the health failed (exit {code}): {said}; the next deployment runs it again"
after_overran = "the step {step} after the health ran past its {seconds}s and was stopped; the next deployment runs it again"
pruned = "pruned the releases {names}"
kept_pinned = "kept the release {release}, which the processes {pids} stand in"
pinned_summary = "{count} releases stand after the prune, the ones past the policy's kept by processes standing in them"
retired_trees = "took away the retired trees {names}"
warning = "WARNING: {warning}"
upload_started = "the backup upload runs as {unit}"
upload_failed = "the backup upload could not be started: {said}"
live = "{commit} is live, with {backup} behind it"
live_alone = "{commit} is live"
deployed_summary = "{commit} of {repository} is live"
