# What a deployment says where its caller reads it (docs/deploy.md): the account of a rollback, and the
# account of a deployment its gate or its own run refused. A harness and the readers of the deploy events
# read them, so they are English. Each `{name}` is filled in with what it names.

# The account of a deployment whose service did not come up: first why, then what the rollback came to,
# then where to read the cause (docs/deploy.md, 「Rollback」). {commit} and {to} are short commits.
[rollback]
restart_refused = "deployment failed: the service could not be restarted on {commit}."
not_answering = "deployment failed: the service on {commit} gave up starting before its health answered."
died_after_start = "deployment failed: the service on {commit} answered and was not running when it was read."
# {step} is the declared step's id.
step_failed = "deployment failed: the step {step} after the health failed on {commit}."
answers = "Rolled back to the earlier release {to}, and the service answers again."
silent = "Rolled back to the earlier release {to}, but the service still does not answer; it is down."
# Why nothing was rolled back, followed by the line after them.
first = "No release was live before, so nothing was rolled back."
before_start = "A deployment with --before-start is not rolled back by itself; a rollback by hand is an ordinary deployment of the older commit (docs/deploy.md, 「Rollback」)."
tree = "The deploy tree could not be rolled back: {detail}"
bot_down = "The service is down."
# Where the cause is read: {cause} is the journal command of the unit that did not come up.
cause = "Cause: {cause}"
# The reason the `deploy-rolled-back` event carries.
reason = "rolled back after a failed deployment: the service on {commit} did not come up, so it is back on the earlier release {back}"
# The same reason where a step after the health failed: {step} is the step's id.
step_reason = "rolled back after a failed deployment: the step {step} after the health failed on {commit}, so it is back on the earlier release {back}"
# The same two where the console probe refused the release: {point} is the point it refused at.
console_refused = "deployment failed: the console probe refused {commit} at {point}."
console_reason = "rolled back after a failed deployment: the console probe refused {commit} at {point}, so it is back on the earlier release {back}"

# A deployment that put nothing live, {main} the main branch with its short commit.
[refusal]
check_failed = "the deployment of {main} did not pass the static check, so nothing went live."
# {files} is `files`, or nothing.
suite_failed = "the deployment of {main} did not pass the suite, so nothing went live.{files}"
files = " Failing files: {files}."
failed = "the deployment of {main} did not finish (exit {code}), so nothing went live; what stopped where is in the deploy unit's journal."
# A deployment refused while another holds the lock.
locked = "the deployment was refused, so nothing went live: another deployment is running; start it again once that one ends."

# The deployment's fixed counts and limits.
[numbers]
# How many dirty files a refusal of an unclean tree names before it says how many more there are.
dirty_shown = 10
# How many characters of what a failed command printed a line quotes.
quoted_chars = 300
# How many characters of a live process's command line a pinned release's account carries.
command_chars = 200
# How many releases may stand before a prune sends `releases-pinned`.
releases_told_above = 12
# How long a wait for the health rests between asks, in milliseconds.
health_poll_ms = 500
# How often a wait for the health asks systemd whether the unit gave up starting, in milliseconds.
unit_check_ms = 5000
# How many lines of a failing service's journal the deploy output keeps.
journal_lines = 40
# How long the wait for quiet rests between asks of the declared `quiet` command, in milliseconds.
quiet_poll_ms = 15000
# How many asks running the declared `quiet` command may answer neither 0 nor 1 before the deployment
# fails with nothing changed (docs/deploy.md, 「What the deploy run does, in order」).
quiet_unanswered_asks = 3
# How many hours back a passed run of the whole suite on the commit leaves the gate's own suite out
# (docs/deploy.md, 「What the deploy run does, in order」); a run begun earlier is none.
passed_suite_hours = 24

# What the deploy run says as it goes (docs/deploy.md, 「What the deploy run does, in order」): {commit} a
# short commit, {release}, {path}, {dir} and {data} places, {unit} and {name} units, {said} and {why}
# what a command or a call came to, {code} an exit code, {step} a step's id.
[run]
refused = "refused: {why}"
no_deploy = "the declaration names no [deploy] root and data root, so this repository deploys nothing"
harness = "a harness's shell does not deploy: CLAUDE_PID names a harness's process, and a deployment outlives every harness's call"
data_relative = "the data root {data} is not an absolute path"
data_in_tree = "the data root {data} sits inside the git work tree at {tree}; move it out"
data_missing = "the data root {data} does not exist, so there is nothing to back up and nothing to run against"
backup_in_data = "the backup directory {backup} stands inside the data root {data}, where nothing the backup writes could be taken away again; put it outside"
backup_in_tree = "the backup directory {backup} sits inside the git work tree at {tree}; put it outside"
env_missing = "the env file {target} that {link} links to is missing, and the services cannot start without it"
fetch_failed = "git fetch failed, so what the remote has cannot be known: {said}"
no_commit = "{commit} names no commit of this checkout"
# The declaration the commit carries, where the deployment cannot run by it: {commit} a short commit, {source}
# the checkout.
commit_no_deploy = "the declaration {commit} carries names no [deploy] root and data root, so the commit deploys nothing"
commit_elsewhere = "the declaration {commit} carries names the repository or places the deployment otherwise than the checkout's at {source}; deploy it from a checkout brought to {commit}"
# Where a commit must stand to be deployable, as a refusal names it.
remote = "any branch of the remote"
deploying = "deploying {commit}: {subject}"
again = "{commit} is already what is deployed; laying it down again"
major = "the change is major: version {version} against the live {previous}; the repositories that build on this one are run"
unit_faults = "{faults}; the reload after the flip would make that unit vanish, so put its file back or relink it in {dir} by hand first"
dry = "--dry-run: {commit} would go live over {live}; nothing was changed"
nothing_live = "nothing deployed before"
adopted = "the deploy tree {dir} was adopted into {release}; the directory retired to {retired}"
adopt_failed = "the deploy tree could not be adopted into a release: {why}; no service was touched"
gate_left_out = "the gate is left out, so no check or suite runs before the backup"
gate_failed = "the deployment of {commit} did not pass its gate, so nothing went live: {reason}"
# The gate's reason where its static check or its suite did not pass, {code} the exit.
gate_check = "the static check ended with exit {code}"
gate_suite = "the suite ended with exit {code}"
# The gate's suite left out for a passed run of the whole suite on the commit: {id} the test run, {commit} a
# short commit, {when} when it began, {checkout} where it ran, {on} the line below or nothing, {log} its log.
suite_left_out = "the suite is left out: test run {id} passed the whole suite on {commit} from a clean tree, begun {when} in {checkout}{on}; its log is {log}"
# The machine whose record holds the run, where it is not this one: {machine} its label.
on = " on {machine}"
flaky = "flaky: {test} ({unit}) passed only when run once more"
backup_none = "no backup is declared, so none is taken"
backup_unnamed = "the backup could not be named: ninety-nine backups were already taken this second; nothing was changed"
backup_taken = "backup {path} taken ({bytes} bytes)"
backup_failed = "the backup failed: {failure}; {left}"
prepare_failed = "the release of {commit} could not be prepared: {why}; no service was touched"
prepared = "release {release} {how}"
made = "made afresh"
taken = "taken as it stands"
setup_failed = "`{command}` failed in {release}: {said}"
build_failed = "the build failed at {step} (exit {code}): {said}; every service is untouched"
metadata_failed = "the Cargo workspace's binaries could not be read: {why}; every service is untouched"
place_failed = "the binaries could not be placed into the release: {why}; every service is untouched"
placed = "placed {count} binaries; changed: {changed}"
before_failed = "the step {step} before the flip failed (exit {code}): {said}; nothing was flipped"
unrecorded = "the deployment record could not be written: {why}; nothing was flipped"
recorded = "recorded in {path}"
unresolved = "{links} would link to nothing in the release, so nothing was flipped and the record was put back"
flip_failed = "the deploy tree could not be flipped onto {release}: {why}; the record was put back, so what was running is still running"
flipped = "deploy tree flipped onto {release}"
relinked = "relinked {name} to {to}"
dangling = "{names} still link to nothing in the deploy tree; the units were not reloaded and no service was restarted"
set_aside = "{name} stood as a plain file; it is kept as {name}.before-deploy and linked from the tree"
link_failed = "the units could not be linked: {why}; no service was restarted"
linked = "linked {name} to {to}"
timer_failed = "{timer} could not be started; the next deployment tries again"
restarted = "{unit} restarted"
restart_failed = "{unit} did not restart; the next deployment tries again"
left_running = "{unit} left running: what it runs did not change"
no_bot = "no unit is marked bot, so no health is waited on"
stop_failed = "{unit} could not be stopped for the command run before the start, so the command was not run"
before_start = "running before the start: {command}"
# The id the command run before the start is written under in the progress record.
before_start_step = "before-start"
before_start_failed = "the command run before the start failed: {said}; {unit} is stopped, and a deployment with --before-start is not rolled back by itself"
quiet_asking = "asking `{quiet}` whether work stands under way that the restart would cut, until none does"
quiet_live = "work stands under way, waiting: {said}"
quiet_forced = "work stands under way, and --force-live goes on at once, cutting it: {said}"
# A quiet that answered neither 0 nor 1: {ended} is `quiet_exit` or `quiet_no_exit`, {ask} the asks running
# that answered so, {asks} the policy's bound.
quiet_unanswered = "the quiet could not tell whether work stands under way ({ended}, {ask} of {asks} asks), asking again: {said}"
quiet_failed = "the quiet could not tell whether work stands under way {asks} asks running, so nothing was changed ({ended}): {said}"
quiet_forced_unanswered = "the quiet could not tell whether work stands under way ({ended}), and --force-live goes on at once: {said}"
quiet_exit = "exit {code}"
quiet_no_exit = "no exit code: a signal ended it or it did not start"
waiting = "waiting for `{health}` to answer, or for the unit to give up starting"
watching = "reading whether {unit} is running"
stayed = "{unit} came up"
retired = "{unit} retired: stopped, disabled and unlinked"
retired_plain = "{unit} retired: stopped and disabled; it stands as a plain file, so it was left in place"
unretired = "{unit} was stopped and disabled, and its link could not be taken out: {why}"
after_failed = "the step {step} after the health failed (exit {code}): {said}"
pruned = "pruned the releases {names}"
kept_pinned = "kept the release {release}, which the processes {pids} stand in"
pinned_summary = "{count} releases stand after the prune, the ones past the policy's kept by processes standing in them"
retired_trees = "took away the retired trees {names}"
warning = "WARNING: {warning}"
# The units the release marks for the placed machine (docs/deploy.md, 「The unit links」): {names} the units,
# {machine} the machine's label and {said} what the machine or `ssh` said.
placed_laid = "laid {names} on the placed machine {machine}, its timers started"
placed_unlaid = "{names} could not be laid on the placed machine {machine}: {said}; the next deployment tries again"
# The placed machine's testbed brought to the release put live (docs/deploy.md, 「Where a deployment runs」):
# {files} the files written there, {machine} the machine's label, {commit} the commit put live and {said} what the
# machine answered where it was not brought to it.
testbed_brought = "copied the release's testbed to the placed machine {machine} as {files}; its built-from read back names {commit}"
testbed_unbrought = "the testbed on the placed machine {machine} was not brought to {commit}: {said}; this deployment stays live, and the next deployment brings it to its own release before its gate"
upload_started = "the backup upload runs as {unit}"
upload_failed = "the backup upload could not be started: {said}"
live = "{commit} is live, with {backup} behind it"
live_alone = "{commit} is live"
deployed_summary = "{commit} of {repository} is live"

# What the adoption of a deploy tree that is still a directory says (docs/deploy.md, 「A deploy tree that
# is still a directory」): {dir} a directory, {release} a release, {commit} a short commit, {path} a
# submodule's path, {said} and {why} what a command or a call came to.
[adopt]
retired_earlier = "an earlier adoption's directory retired to {dir}"
a_file = "{dir} stands as a file, which no deploy tree is"
no_worktree = "the directory {dir} is no git worktree at a commit: {said}"
not_built_from = "the directory {dir}'s bin/built-from does not name the commit it stands on, {commit}"
adopting = "adopting the directory {dir} at {commit} into a release"
elsewhere = "the release of {commit} was prepared somewhere else: {release}"
not_exchanged = "the directory and the link onto {release} could not be exchanged: {why}"
linked = "the deploy tree is now a link onto {release}"
retired = "the directory it was retired to {dir}"
bin_not_taken = "the directory's bin/ could not be taken into {release}: {why}"
not_retired = "the exchanged directory {dir} could not be retired: {why}"
not_repaired = "the retired tree {dir} could not be repaired: {said}"
submodule_not_pointed = "the retired tree's submodule {path} could not be pointed at {dir}: {said}"
not_removed = "the retired tree {dir} could not be removed: {why}"

# What the watch of the `bot` service coming up says (docs/deploy.md, 「Rollback」):
# {seconds} a time, {code} an exit, {said} and {why} what came of it, {active} and {sub} the unit's states,
# {unit} the unit.
[boot]
# What one ask of the health heard.
not_run = "could not be run: {why}"
exit = "exit {code}"
exit_said = "exit {code}: {said}"
# The code of an ask ended by a signal.
a_signal = "a signal"
# Why the service was not read running once it came up.
unasked = "systemd could not be asked for the unit"
unit_is = "the unit is {active}/{sub}"
# The machine's strain: {load} its load, {io} and {memory} the share of the last minute stalled on each.
strain = "load {load}, stalled on I/O {io} and on memory {memory} of the last minute"
unknown = "unknown"
# The lines the deploy output keeps of a service that did not come up or stay up.
waited = "waited {waited}s for the health `{command}`: {asks} asks, the last heard {last}{gave_up}"
gave_up = "; {unit} gave up starting"
unit_unasked = "{unit}: systemd could not be asked"
unit = "{unit}: {active}/{sub}, main process {pid}{process}, {restarts} automatic restarts, last exit status {status}"
process = " ({process})"
machine = "machine: {strain}"
journal = "{unit}'s journal since the restart, its last {lines} lines at most:"
journal_unread = "journalctl could not be read: {said}"
fell = "{unit} answered and was not running: {why}"

# What making a fresh build tree and bringing its submodules says: {tree} and {at} places, {commit} a
# short commit, {what} the step, {said} and {why} what a command or a call came to.
[expansion]
not_placed = "the build tree {tree} could not be put at {commit}: {said}"
not_discarded = "the build tree {tree}, made from another checkout, could not be removed: {why}"
not_emptied = "could not empty {at} for its submodule: {why}"
# A git step that failed, followed by what it said.
failed = "{what}: {said}"
no_addresses = "could not read the submodules' addresses"
not_pinned = "could not bring the submodules of {tree} to their pins"
trees_unread = "the trees {tree} names outside it could not be read: {said}"
tree_absent = "{at}, which {tree} names outside it, stands nowhere beside the checkout: {why}"
tree_unlinked = "{at} could not be laid beside {tree}: {why}"
# The prune's removal of a build tree's target directory meeting a deployment begun since it was found idle.
target_in_use = "a deployment began since it was found idle"

# What a rollback says as it goes (docs/deploy.md, 「Rollback」): {commit} a short commit, {release} a
# release, {names} units, {why} what a call came to.
[rolling]
# Why nothing was rolled back, as the account's detail.
before_start = "the command run before the start may have reshaped the data for the new code"
first = "no commit was live before this one"
back_to = "rolling back to {commit}, which was live before"
would_not_stop = "the service that did not come up would not stop; the rollback goes on and restarts it"
# {links} is `links_one` or `links_many`, as many units as {names} holds.
dangling = "{names} still {links} to nothing in the deploy tree; the service is started all the same"
links_one = "links"
links_many = "link"
answers = "the service answers again on {commit}"
silent = "the service does not answer on {commit} either"
not_built = "the release of {commit} no longer stands built at {release}"
flip_failed = "the deploy tree could not be flipped onto {release}: {why}"
flipped = "deploy tree flipped back onto {release}"
unrecorded = "the deployment record could not be written back: {why}"
unlogged = "the deployment log could not be appended to: {why}"

# What preparing and pruning the releases says (docs/deploy.md, 「The releases」): {release} a release,
# {commit} a short commit, {name} a release's name, {said} and {why} what a command or a call came to.
[release]
live_unbuilt = "the live release {release} does not stand built for {commit}, and it is not made again under what runs"
leftover = "taking away what an unfinished run left at {release}"
not_added = "the release {release} could not be added at {commit}: {said}"
unread_processes = "the live processes could not be read, so no release was pruned"
not_removed = "the release {name} could not be removed: {why}"

# Why a checkout or its unit links cannot be deployed (docs/deploy.md, 「What it refuses」): {named} the dirty
# files shown and {rest} `more` or nothing, {commit} a short commit, {branch} where it must stand, {unit} a
# unit link, {path} what it links to, {count} and {files} the files of its name the release holds.
[tree]
dirty = "this run left uncommitted changes to tracked files, so the commit would go live without them: {named}{rest}"
more = ", and {count} more"
no_commit = "the working tree is on no commit at all"
unpushed = "{commit} is not on {branch}; an unpushed commit is not deployable"
link_gone = "{unit} links to {path} in the deploy tree, which the commit no longer has, and no file of that name stands in it"
link_several = "{unit} links to {path} in the deploy tree, which the commit no longer has, and {count} files of that name stand in it ({files})"

# What handing a run to a transient unit says (docs/boundary.md, 「The verbs」): {unit} the unit, {said}
# what starting it came to.
[unit]
notice = "running as {unit}, which outlives this call; read it with: journalctl --user -u {unit} --no-pager"
not_started = "refused: its unit {unit} could not be started, and it does not run in this shell instead: {said}"

# Why the guarded removal takes nothing away (docs/deploy.md, 「What it refuses」): {path} what was to go, {data}
# the data root.
[remove]
inside = "refusing to remove {path}: it is inside the runtime data root {data}"
holds = "refusing to remove {path}: the runtime data root {data} is inside it"

# Why a deployment stops or restarts a unit, written into the record for the unit to read as it starts
# again (docs/boundary.md, 「The record」). {deployment} is the deployment's id, {verb} `stop` or
# `restart`, {commit} the commit and {repository} the repository's name.
[restarts]
putting = "deployment {deployment} {verb}s it to put {commit} of {repository} live"
rolling_back = "deployment {deployment} {verb}s it to roll {repository} back from {commit}"

# The console probe (docs/deploy.md, 「The console probe」): what it asks a service bringing a console screen
# with, and what it says. The statuses are bmo-ui's console plugin contract's; its route and the headers a
# console sets are bmo-chat's console face's constants.
[console]
# The package the shared versions pin as the console layer, whose release a manifest's `layer` names.
layer_package = "bmo-ui"
# The keys the declared `reach` command answers.
address_key = "address"
console_token_key = "consoleToken"
token_key = "token"
# The manifest's fields the probe reads.
layer_field = "layer"
words_field = "words"
bundle_field = "bundle"
stylesheet_field = "stylesheet"
role_field = "role"
owner_key_field = "ownerKey"
share_reads_field = "shareReads"
# The header a credential goes in, and how it is written there: {token} the credential.
credential_header = "Authorization"
credential = "Bearer {token}"
# The owner key the probe sends where a manifest asks for one: a module carries no reader's data, so any key
# opens it.
owner_key = "1"
# How long each ask waits for its answer, in seconds.
wait_seconds = 30
# What the contract answers: a read, a call with no role allowing the screen's, a call lacking the console's
# credential.
answered = 200
no_role = 403
not_console = 401
# What the probe says: {address} the service's base address, {points} how many points held, {package} the
# pinned package, {layer} the manifest's layer, {point} where it refused and {why} what came.
probing = "probing the console face at {address}"
held = "the console face holds to the contract ({points} points)"
no_pin = "the shared versions pin no {package}, so the manifest is read by no release of it and its layer {layer} is held to none"
no_shared = "the declaration names no shared versions, so the manifest is read by no release of the layer and its layer {layer} is held to none"
# A manifest naming no layer, as those lines name it.
no_layer = "none"
refused = "the console probe refused the release at {point}: {why}"
# The points: {what} is one of the four paths' names, {role} the manifest's role.
point_reach = "the reach"
point_release = "the layer's release"
point_manifest = "the manifest"
point_reading = "the manifest's reading"
point_layer = "the layer"
point_words = "the words"
point_no_role = "the {what} with no role"
point_role = "the {what} with the role {role}"
point_own_token = "the {what} with the service's own token"
manifest = "manifest"
words = "words"
module = "module"
stylesheet = "stylesheet"
# Why a point did not hold: {code} the reach command's exit, {said} what it said on its errors, {path} a path
# of the service's API, {found} and {wanted} what came and what the contract asks, {file} and {sha256} the
# pinned packed file, {why} the fault.
reach_failed = "the reach command ended {code}: {said}"
# How the reach command ended where a signal ended it.
signal = "by a signal"
reach_unread = "the reach command did not answer one JSON object naming address, consoleToken and token: {why}"
status = "GET {path} answered {found} where the contract asks {wanted}"
unanswered = "GET {path} was not answered: {why}"
not_object = "GET {path} answered no JSON object: {why}"
no_release = "the release tracks no file {file} holding the pinned bytes {sha256}, so the layer's reading cannot run; vendor the pinned release as it stands"
reading_failed = "{why}"
no_field = "the manifest's reading holds no {field}"
layer_differs = "the manifest names the layer {found} where the shared versions pin {wanted}"
