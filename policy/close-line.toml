# What the repository's close line says and the number it keeps to (docs/testbed.md, 「The close
# line」): the line a close writes while it waits for the line, and what it says of the wide lane it holds
# through its check. A job reads the words, so they are English. Each `{name}` is filled in with what it names.

# The repository's close line, {who} where it stands: its job's place and its checkout joined, or its pid.
[line]
waiting = "close line: waiting for the repository's close line ({seconds}s so far): {ahead} ahead, {holder}"
nobody = "nobody holding it yet"
held_by = "held by {who}"
joiner = " · "
pid = "pid {pid}"

# How often a close waiting for the line says where it stands; and the line's lock file name, its
# repository's name made safe for a file and cut to `lock_name_chars` from the front, then that many hex
# digits of the whole name's digest.
[numbers]
notice_seconds = 30
lock_name_chars = 64
lock_digest_chars = 12

# The wide lane a close holds through each part of its check, {words} how its turn was settled.
[stretch]
command = "the close's check"
front_first = "close: lets a deployment waiting at the front take the machine's turn first"
held = "close: the machine's turn {words}; held through the check"
