# What the quick checks say (docs/checks.md, 「The quick checks」), and the fixed words they read the
# tree by. A harness reads the lines, so they are English. Each `{name}` is filled in with what it names.

# A check's line: {name} is the check, {said} what it found; {count} faults are said as `to_fix`.
head = "quick check: {name}: {said}"
to_fix = "{count} to fix"
# A check named with the declared path it reads.
named = "{name} ({input})"
# A check the declaration enables without the input it reads.
no_input = "the declaration names no {input}"
# A file a check cannot read: {path} and {why} it could not.
unreadable = "{path}: {why}"

[wording]
clean = "clean over {count} files"
hit = "{path}:{line}: \"{term}\" → {instead}"
stale = "{path}: allowed \"{term}\" matches nothing"
not_markdown = "{document} does not read as markdown: {why}"
unknown_language = "{document}: unknown language code \"{lang}\" in: {item}"
own_sense = "{document}: a phrase of a word's own sense must hold a banned term listed above it: {item}"
# The document's sections, by their level-two headings.
banned_section = "Banned terms"
own_sense_section = "Uses in the word's own sense"
allowed_section = "Allowed uses"

[dashes]
clean = "none over {count} files"
hit = "{path}:{line}: {excerpt}"
# How many characters of a piece its excerpt keeps either side of the first dash.
excerpt_reach = 40

[language]
clean = "{count} files within the ledger"
below = "{count} files within the ledger, {below} below it: bmo-testbed check language --settle lowers it"
over = "{path}: {count} lines hold letters that are not English where the ledger allows {allowed}: write it in English, or move it out of the code"
not_ledger = "{ledger} does not read as a ledger: {why}"
# The report by kind: its head over {count} areas or files, a row, one kind's count, and the cut.
areas = "{count} areas"
files = "{count} files"
row = "{name}  {total}  {kinds}"
kind = "{kind} {count}"
cut = "cut at {shown} of {rows} rows; name a narrower prefix for the rest"
# The extensions of a code file.
code = ["ts", "tsx", "mts", "cts", "js", "jsx", "mjs", "cjs", "vue", "rs", "py", "sh", "kt", "cs"]

[cargo_profile]
# The workspace manifest the check reads at the repository's root.
manifest = "Cargo.toml"
clean = "{count} profile settings keep every build small"
# {profile} and {key} name the setting, {found} what the manifest says and {wanted} what keeps builds small.
differs = "{manifest}: [profile.{profile}] {key} is {found} where it should be {wanted}"
missing = "{manifest}: [profile.{profile}] {key} is not set where it should be {wanted}"
not_manifest = "{manifest} does not read as a Cargo manifest: {why}"

# The settings that keep every build's output small, as bmo-chat's docs/conventions.md, 「Rust builds」,
# states them: debug information down to line numbers and kept beside the objects, none in a test binary,
# no incremental state, none for a dependency, and none kept in a release. A key with dots in it is a path
# through the profile's tables: `package.*.debug` is the setting of `[profile.<name>.package."*"]`.
[cargo_profile.wanted.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false
"package.*.debug" = false

[cargo_profile.wanted.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false
"package.*.debug" = false

[cargo_profile.wanted.release]
debug = false
strip = "debuginfo"

[shared_versions]
# The shared versions' file at the root of the repository the declaration names, and its two tables: the
# line each listed crate is written with, and the version each crate below them is locked at.
file = "shared-versions.toml"
lines = "dependencies"
snapshot = "snapshot"
# The table pinning the packages vendored as one release's file, each by its version, its file and the
# file's sha256.
packages = "packages"
# The table naming, for a pinned package, the earlier releases its pinned release stays compatible with, each
# by its version, its file and the file's sha256; and why such a table does not read, {name} the package it
# names that the file pins none of.
compatible = "compatible"
compatible_unpinned = "compatible releases of {name}, a package the file pins none of"
# A package manifest, the lists in it naming packages, and the start of an entry naming a file.
package_manifest = "package.json"
package_lists = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies", "overrides", "resolutions"]
file_prefix = "file:"
# The lock a checkout's Cargo build resolves into, and the beginnings of a registry package's source.
lock = "Cargo.lock"
registry_sources = ["registry+", "sparse+"]
clean = "{count} entries hold to the shared versions"
# Where the shared versions stand: {registry} the machine's registry of checkouts, {repository} the name the
# declaration gives, {roots} the checkouts declaring it, {path} the file and {why} what it came to.
unread_registry = "the registry of checkouts {registry} does not read: {why}"
no_checkout = "no checkout in the registry {registry} declares {repository}, whose root holds the shared versions"
two_checkouts = "more than one checkout in the registry {registry} declares {repository}: {roots}"
not_shared = "{path} does not read as the shared versions: {why}"
# The file as the shared repository's main branch holds it: {path} the file, {main} the branch and {why} what
# git said.
not_on_main = "{path} does not read on the branch {main}: {why}"
not_manifest = "{path} does not read as a Cargo manifest: {why}"
not_lock = "{path} does not read as a Cargo lock: {why}"
not_package_manifest = "{path} does not read as a package manifest: {why}"
not_object = "it is no JSON object"
# A package manifest's entry for a pinned package: {manifest}, the {list} it stands in, the package {name},
# the entry {found} as it reads, and {why}: what to write, with the pin's {range} of versions, the pinned
# {version} and {file}, the {path} an entry's file stands at, the sha256 {found} it hashes to, and the
# {file} and {wanted} sha256 of the release it names.
package = "{manifest}: {list} {name} = {found}; {why}"
package_version = "write a version of the range {range}, or file: naming its release's file; the pinned release is {version}, its file {file}"
package_other_file = "the file is of no release of the range {range}; vendor the pinned release {file} as it stands and name it, the version {version}"
package_missing = "{path} does not stand; vendor the release {file} there as it stands"
package_other_bytes = "{path} hashes to {found} where the release {file} hashes to {wanted}; vendor the release as it stands"
# The versions of a pin's range, joined as a fault and the report name them.
range_joiner = ", "
# A manifest's entry for a listed crate: {manifest}, the [{table}] it stands in, the crate {name}, the
# entry {found} as it reads and the line {wanted} to write instead.
line = "{manifest}: [{table}] {name} = {found}; write: {wanted}"
inherited = "{manifest}: [{table}] {name} = {found} adds to the workspace's line; write: {wanted}"
# The line of an entry that takes the workspace's, as it is written plainly and where it is optional.
inherit = "{name}.workspace = true"
inherit_optional = "{name} = { workspace = true, optional = true }"
# The only keys an entry taking the workspace's line may hold.
inherit_keys = ["workspace", "optional"]
# A locked crate: {lock}, the crate {name} at {found} where the snapshot holds {wanted}.
locked = "{lock}: {name} {found} where the snapshot holds {wanted}; run: bmo-testbed cargo update -p {name}@{found} --precise {wanted}"
# An exception of the declaration that does not stand: the crate {name}, a {version} it names, {why} its
# line does not read.
not_listed = "the exception for {name} is for a crate the shared versions list no line or version of"
same_line = "the exception for {name} writes the shared line itself"
not_locked = "the exception for {name} names {version}, which no lock holds"
bad_line = "the exception for {name} does not read as one line for {name}: {why}"
# `check shared-versions --report`: a checkout by its declared {name}, how many entries it holds and how
# many differ, the {crates} whose lines differ, the {versions} its lock holds otherwise as `{name}
# {found}→{wanted}`, and the {others} faults; then how many checkouts differ of all read.
report_clean = "{name}: holds to the shared versions ({count} entries)"
report_differs = "{name}: {count} to fix: {parts}"
report_lines = "lines {crates}"
report_locked = "lock {versions}"
report_version = "{name} {found}→{wanted}"
report_others = "{count} other"
report_joiner = "; "
report_list_joiner = ", "
report_unread = "{path}: {why}"
# A pinned package the checkout names: the package {name}, the {entries} it writes for it, each as written
# and marked where its file is missing or holds other bytes, beside the pinned version {wanted} and the
# pin's {range} of versions.
report_package = "{name} {entries} beside the pin {wanted} of the range {range}"
report_missing_file = "{entry} (missing)"
report_other_bytes = "{entry} (other bytes)"
report_total = "{differs} of {all} checkouts differ from {file}"
report_unit = "checkouts"
report_how = "run bmo-testbed check shared-versions in a checkout left out"

[layout]
clean = "none over {count} files"
readme = "README.md"
# The first header cell of the README's folder table.
table_head = "Folder"
not_markdown = "{readme} does not read as markdown: {why}"
no_table = "{readme}: no table opens with a {head} column"
unnamed = "{folder}/: a top-level folder the {readme} folder table does not name"
gone = "{readme}: the folder table names {folder}/, which the tree does not hold"
language = "{folder}/: a folder named for a language"
not_member = "{folder}/{file}: its folder is no member of the {workspace} workspace"
no_manifest = "{member}/: a member of the {workspace} workspace holding no {file}"
# How many levels from the top a folder named for a language is looked for in.
levels = 2
# The names of languages as a folder would be named for one: no folder of the top `levels` levels is
# named any of these, since a folder is named for its role.
languages = [
  "bash",
  "c",
  "cpp",
  "cs",
  "csharp",
  "go",
  "golang",
  "java",
  "javascript",
  "js",
  "kotlin",
  "kt",
  "lua",
  "py",
  "python",
  "rb",
  "ruby",
  "rs",
  "rust",
  "sh",
  "shell",
  "swift",
  "ts",
  "typescript",
]

[dependencies]
clean = "{count} dependencies, each allowed"
foreign = "{manifest}: {name} comes from another repository ({source}) and is no declared base library"
foreign_dev = "{manifest}: {name} comes from another repository ({source}) and is neither a declared base library nor the test kit"
# The testbed's test kit, which a consumer may take as a dev-dependency (docs/boundary.md, 「The crates」).
test_kit = ["@bmo-testbed/testkit", "bmo-testbed-test-support", "bmo-testbed-scratch-database"]

# The personal-data check (docs/checks.md, 「The quick checks」). A finding names the file, the line and the kind,
# never the value.
[personal_data]
clean = "none over {count} files"
hit = "{path}:{line}: {kind}"
# The kinds whose findings the check lets stand for a reason of their own: a mail address in the space kept
# for documents, a home folder named for a role, and an address of no private network.
mail_kind = "a mail address"
home_kind = "a home path"
telephone_kind = "a telephone number"
token_kind = "a token"
network_kind = "a private network address"
# The domains RFC 2606 and RFC 6761 keep for documents: an address there names no person and no machine.
documentation_domains = ["example.com", "example.net", "example.org", "localhost"]
documentation_suffixes = [".example", ".test", ".invalid", ".localhost"]
# Home folders that name a role and no person.
neutral_homes = ["user", "pc", "tester", "qa-admin", "placeholder", "example", "name", "you", "someone"]
# A unit of the service manager written as a template and its instance has a mailbox's shape and names none.
unit_suffixes = [".service", ".socket", ".slice", ".timer", ".target", ".mount", ".scope", ".path"]
# The first two numbers of each IPv4 block kept for private networks: the block's own first address, written
# with its length, names the block and no host.
reserved_blocks = [[10, 0], [172, 16], [192, 168], [169, 254], [100, 64]]

# The forms a line is read for. Each is written so that this file is no sample of what it looks for.
[[personal_data.forms]]
kind = "a mail address"
pattern = '[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'

[[personal_data.forms]]
kind = "a home path"
pattern = '(?:/home|/Users)/[A-Za-z0-9._-]+'

[[personal_data.forms]]
kind = "a home path"
pattern = '[A-Za-z]:[\\/]Users[\\/][A-Za-z0-9._-]+'

[[personal_data.forms]]
kind = "a telephone number"
pattern = '\b01[016789][-\s]?\d{3,4}[-\s]?\d{4}\b'

[[personal_data.forms]]
kind = "a telephone number"
pattern = '\b0(?:2|[3-6][1-5])[-\s]?\d{3,4}[-\s]?\d{4}\b'

[[personal_data.forms]]
kind = "a telephone number"
pattern = '\+\d{1,3}[-\s]\d{2,4}[-\s]\d{3,4}[-\s]\d{4}\b'

[[personal_data.forms]]
kind = "a telephone number"
pattern = '\b\d{3}-\d{3}-\d{4}\b'

[[personal_data.forms]]
kind = "a telephone number"
pattern = '\(\d{3}\)\s*\d{3}-\d{4}'

[[personal_data.forms]]
kind = "a token"
pattern = '\bgh[pousr]_[A-Za-z0-9]{20,}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\bgithub_pat_[A-Za-z0-9_]{20,}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\bglpat-[A-Za-z0-9_-]{20,}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\bAKIA[0-9A-Z]{16}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\bxox[abprs]-[A-Za-z0-9-]{10,}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\bsk-[A-Za-z0-9_-]{20,}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\bAIza[0-9A-Za-z_-]{35}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\bnpm_[A-Za-z0-9]{36}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'

[[personal_data.forms]]
kind = "a token"
pattern = '-----BEGIN [A-Z ]*PRIVATE KEY-----'

[[personal_data.forms]]
kind = "a token"
pattern = '\bBearer\s+[A-Za-z0-9._~+/-]{20,}=*\b'

[[personal_data.forms]]
kind = "a private network address"
pattern = '\b\d{1,3}(?:\.\d{1,3}){3}\b'

[[personal_data.forms]]
kind = "a private network address"
pattern = '(?i)\b(?:fc|fd)[0-9a-f]{2}:[0-9a-f:]{2,}'

[[personal_data.forms]]
kind = "a private network address"
pattern = '(?i)\bfe[89ab][0-9a-f]:[0-9a-f:]{2,}'
