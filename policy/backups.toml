# What the backup and the `backups` verb say and count by (docs/deploy.md, 「Backups」 and 「Sending backups
# away」): the verb's usage, the lines a failed upload's event carries, and the backup's fixed numbers. A
# job and the event's reader read the lines, so they are English. Each `{name}` is filled in with what it
# names.

# Under `usage: bmo-testbed backups`, one line to an entry: {remote} where the backups stand remotely, and
# {keep} how many are kept there.
upload_usage = [
  "Uploads every backup not yet confirmed to {remote}, reads each back to match its size and checksum,",
  "then keeps the newest {keep} remotely and the newest one locally (docs/deploy.md, 「Sending backups away」).",
]
# The note a failed upload's event carries.
upload_failed_note = "The deployment had already ended and was not held up. A backup not confirmed stays on the local disk, and the next run of the upload sends it again."
# The summary line of the `backup-upload-failed` event, ahead of the note: {count} is how many steps
# failed.
upload_failed = "{count} step(s) of the backup upload failed."

# The backup's fixed numbers.
[numbers]
# The zstd level the pack is compressed at (docs/deploy.md, 「Backups」).
pack_level = 3
# How many backups the local directory keeps once their copies are confirmed: the newest, to undo the
# deployment before with no network.
kept_locally = 1
