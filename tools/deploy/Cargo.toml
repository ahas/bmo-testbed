[package]
name = "deploy-tool"
description = "The testbed's hosted deploy tool: a commit put live through the deploy verb for a session the verb refuses, the deployment waited out and its outcome answered."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[[bin]]
name = "deploy-tool"
path = "src/main.rs"
test = false

[dependencies]
bmo-testbed-client = { path = "../../client", default-features = false }
bmo-testbed-core = { path = "../../core" }
bmo-testbed-deploy = { path = "../../deploy" }
bmo-testbed-record = { path = "../../record" }
bmo-testbed-suite = { path = "../../suite" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The record's events aged past its window by hand, which no verb does.
rusqlite.workspace = true
tempfile.workspace = true
toml.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
