# The testbed's Cargo workspace, the only manifest at the root. Every member is listed one line each,
# a crate by its folder; each declares only what it uses from here.

[workspace]
resolver = "3"
members = [
  "backup",
  "cli",
  "client",
  "core",
  "deploy",
  "plugin",
  "record",
  "scratch-database",
  "service",
  "suite",
  "test-support",
  "tools/deploy",
]

# One version for the whole repository, over the boundary docs/boundary.md states.
[workspace.package]
version = "0.1.0-rev.16"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
# The base library whose verdicts the quick checks take: whether a line is English, the wording
# document's terms, and the dashes a person would not type.
bmo-text = { path = "../../base/text", version = "=0.1.0-rev.5", default-features = false }
# The HTTP service's routes, and a stand-in placement endpoint served by the binary's tests.
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
# The base library's console face, whose reading of a console manifest through the layer's own release the
# console probe runs, and whose constants name the contract's route and headers.
bmo-console-face = { path = "../../base/chat/console-face", version = "=0.1.0-rev.8" }
# The shell line a heavy-command classification reads, split the way the shell splits it.
brush-parser = "0.4.0"
chrono = { version = "0.4.41", default-features = false, features = ["std"] }
# A verb's words, read into its flags and arguments.
clap = { version = "4.5.40", features = ["derive", "env", "string"] }
# The terminal's colours taken off a check's log before the warnings in it are read.
console = { version = "0.16.6", default-features = false, features = ["ansi-parsing", "std"] }
# A placed run's event stream, read event by event as it comes.
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
glob = "0.3.4"
# Process groups, signals and file locks.
libc = "0.2.177"
# The README's folder table, read by the layout check.
markdown = "1.0.0"
# TypeScript read by its parser, for imports, test titles and the quick checks.
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_span = "=0.153.0"
percent-encoding = "2.3.2"
regex = "1.11.1"
# The harness plugin's MCP server, on standard input and output.
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
# The record, one SQLite file every verb writes and the service reads, on the SQLite sqlx builds too.
rusqlite = { version = "0.32.1", features = ["bundled"] }
# The JSON Schemas of the members, the tools' inputs and outputs and the OpenAPI document.
schemars = "1.0.4"
# The placement endpoint, asked over HTTP.
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
scraper = "0.25.0"
# A locked version read, to tell its semver line, by the shared versions check.
semver = "1.0.28"
# The per-test databases and the migrator a consumer hands in.
sea-orm = { version = "1.1.17", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres"] }
sea-orm-migration = { version = "1.1.17", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0.219", features = ["derive"] }
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.138"
# Where in a declaration a key that does not read stands, named beside the TOML reader's own account.
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
# A shell word quoted, and a line of words split, the way the shell reads them.
shlex = "2.0.1"
# A placed run's output and result, read off its event stream.
sse-stream = "0.2.6"
# The members' closed sets of words, listed whole for the OpenAPI document.
strum = { version = "0.28.0", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "sqlite", "runtime-tokio"] }
tempfile = "3.20.0"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
# The policy's files and a repository's declaration, read into their types.
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
# A manifest read keeping each line as it is written, by the shared versions check.
toml_edit = { version = "0.22.27", default-features = false, features = ["display", "parse"] }
# A Rust file's comments, strings and test modules, and a screen's template, read by the quick checks.
tree-sitter = "0.27.1"
tree-sitter-html = "0.23.2"
tree-sitter-rust = "0.24.2"
url = "2.5.8"

# The build profiles bmo-chat's docs/conventions.md, 「Rust builds」, states, which the cargo-profile quick
# check holds: debug information down to line numbers in a development build, none in a test binary, whose
# panics still name their file and line, and no incremental state, since every checkout's crates build
# under names of their own in the one shared build directory.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
