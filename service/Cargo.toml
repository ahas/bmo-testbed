[package]
name = "bmo-testbed-service"
description = "The testbed's HTTP service: the record and the lanes served read-only behind a bearer token, with one event stream."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
axum.workspace = true
bmo-testbed-client = { path = "../client", default-features = false }
bmo-testbed-core = { path = "../core" }
bmo-testbed-record = { path = "../record" }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
bmo-testbed-client = { path = "../client" }
reqwest.workspace = true
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
