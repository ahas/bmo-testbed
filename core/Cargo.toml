[package]
name = "bmo-testbed-core"
description = "The machine's turns for heavy test and build commands, taken through one ticket-queue lock."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
chrono = { workspace = true, features = ["clock"] }
libc.workspace = true
regex.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
