[package]
name = "bmo-testbed-backup"
description = "A machine's databases and data folders dumped, packed, sent to its destinations, rotated there and restored by a drill."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
# The policy loader, the lock and the event hook.
bmo-testbed-core = { path = "../core" }
# The guarded removal every local deletion goes through.
bmo-testbed-deploy = { path = "../deploy" }
chrono = { workspace = true, features = ["clock"] }
glob.workspace = true
# The free space of the disk a destination's store writes to.
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
toml.workspace = true
# A server's address with another database in place of its own.
url.workspace = true

[dev-dependencies]
# The test server's address.
bmo-testbed-scratch-database = { path = "../scratch-database" }
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
