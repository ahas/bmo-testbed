[package]
name = "bmo-testbed-record"
description = "The testbed's record: its test runs, deployments, log lines, restarts and events, in one SQLite file every verb writes and the service reads."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
bmo-testbed-client = { path = "../client", default-features = false }
bmo-testbed-core = { path = "../core" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
