[package]
name = "bmo-testbed-supervise"
description = "The set's services run without systemd: the unit files read, their processes started, watched and restarted, and stand-ins for systemctl, systemd-run and journalctl."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
# One test target, the harness at tests/main.rs, with a module per file of tests (bmo-chat's
# docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
bmo-testbed-core = { path = "../core" }
chrono = { workspace = true, features = ["clock"] }
clap.workspace = true
jiff.workspace = true
libc.workspace = true
oncalendar.workspace = true
serde.workspace = true
serde_json.workspace = true
shlex.workspace = true
systemd-unit-edit.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
